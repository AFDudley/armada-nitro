# Pre-commit configuration generated by exophial init (ansible/init.yml).
# Languages: python, typescript, rust -- set by hand to cover every tracked .py/.ts/.rs file (exo-5d9).
# Run: pre-commit install && pre-commit run --all-files
# Never clobbered on re-run (template force=false).

# src/nitro/ is vendored go-nitro (see README): kept byte-identical to upstream.
# docs/references/nitro/sources/ holds retrieved specification copies: kept
# byte-identical to their checksums in docs/references/nitro/README.md.
# lib/ is the forge submodules (vendored dependencies). On the host they are git
# submodules, so pre-commit never descends into them. The commit-boundary gate
# runs in a container built from the judged commit, where fetch-submodules.sh
# materializes them as plain files for forge; excluding lib/ keeps the gate from
# linting or reformatting vendored sources, matching the host.
exclude: ^(src/nitro/|docs/references/nitro/sources/|lib/)

repos:
  # === Exophial-vendored gates ===
  # claude-md-coverage: a commit that INTRODUCES a source directory must add
  # that directory's CLAUDE.md in the same change (the Literate Code
  # Principle's enforcement corollary). The script ships in the exophial wheel
  # and `uv tool install` exposes the `exophial-check-claude-md` console
  # script on PATH, so this entry is machine-independent in any consumer repo.
  # Only NEW directories trigger — the existing baseline never retro-fails.
  # Exempt data/fixture trees with `args: [--skip, <segment>]` (consumer
  # policy; the script is repo-agnostic).
  # Gates and job runners reach the fixturenet only through `laconic-so deployment
  # run-job` and geth RPC. The deployment's data directory is root-only (mode 0700,
  # set by the laconic-tech-ops infra/kelce host_cpu_policy role), so host code that
  # reads it fails at run time; these hooks refuse
  # such code at commit time instead, including the sudo/chmod workarounds a worker
  # might reach for (rix has passwordless sudo). Operator tooling that manages the
  # deployment itself (fixturenet-new, the base-snapshot scripts) is exempt. Inside a
  # job container `chmod` on its own files is fine, so compose-jobs are only checked
  # for host paths (including bind mounts of repo or worktree files: a job's code comes
  # from the env image).
  - repo: local
    hooks:
      - id: gate-no-host-deployment-access
        name: Gates and runners reach the fixturenet only via run-job and RPC
        language: pygrep
        entry: '\bsudo\b|\bchmod\b|\bchown\b|deployments/[^\s"'']*/data\b|armada_env'
        files: ^(scripts|env/gates|stack/scripts)/
        exclude: ^stack/scripts/(fixturenet-new|fixturenet-recover|fixturenet-base-snapshot|fixturenet-base-common\.sh|base-key\.py|fixturenet-base-build|verify-r2-[a-z-]+\.py)$|\.md$
      - id: job-no-host-deployment-path
        name: Compose jobs name no host deployment data path
        language: pygrep
        entry: 'deployments/[^\s"'']*/data\b|\.\./data/|/home/|\.worktrees/'
        files: ^stack/compose-jobs/
      - id: fixturenet-base-build-standalone
        name: No gate job, compose job or worker script calls fixturenet-base-build
        language: pygrep
        entry: '\bfixturenet-base-build\b'
        files: ^(env/gates/|stack/compose-jobs/|scripts/)
        exclude: ^scripts/verify_base_build_caller_rule\.py$

  # arn-46d.2: fixturenet-base-build-standalone (above) covers env/gates/,
  # stack/compose-jobs/ and scripts/ (top-level); this hook additionally
  # covers stack/scripts/ specifically -- the worker-script test case in
  # derived-arn-46d.2.spec.json plants its caller at
  # stack/scripts/fixturenet-base-build-worker, which the hook above's
  # files: pattern does not reach. Kept narrower by its own files: list so
  # it adds coverage, not duplicate noise, over the existing hook.
  # Excludes fixturenet-new and verify-fixturenet-new-missing-base.sh (arn-46d.1):
  # both legitimately print/check the literal string "fixturenet-base-build" in
  # the refusal message and its own proof, never invoke it.
  - repo: local
    hooks:
      - id: verify-fixturenet-base-build-callers
        name: No gate/compose/worker caller of fixturenet-base-build
        entry: fixturenet-base-build
        language: pygrep
        files: "^(env/gates/|stack/compose-jobs/|stack/scripts/)"
        exclude: "^stack/scripts/(fixturenet-base-build|fixturenet-new|verify-fixturenet-new-missing-base\\.sh)$"

  - repo: local
    hooks:
      - id: claude-md-coverage
        name: New source directory carries its CLAUDE.md
        entry: exophial-check-claude-md
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

  # reroute-main-commit (exo-32c): a plain `git commit` while `main`/`master`
  # is checked out in the shared integration checkout is the one write path
  # onto main nothing else guards (block_worktree_leak.py only ever sees a
  # command an agent asks Claude Code to run). This local hook fires on every
  # `git commit` from a non-integrator process, refuses the commit, and
  # captures the staged content onto a fresh `worker/<id>` branch in its own
  # worktree instead of dropping it.
  #
  # `stages: [pre-commit]` is load-bearing (exo-4ba9): an omitted `stages:`
  # key matches EVERY stage, so with `always_run: true` the guard also fired
  # on `pre-commit run --all-files [--hook-stage manual]` — a lint sweep, not
  # a commit — and `reset --hard`ed the checkout, destroying its unstaged
  # tracked files.
  - repo: local
    hooks:
      - id: reroute-main-commit
        name: Refuse a direct commit on main; reroute it to a worker branch
        entry: exophial-reroute-main-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # red-before-green-pre-push (exo-8d1.5): before a push lands, replay every
  # test the pushed commits ADD — the exact test code the commit introduces —
  # against the production tree as it stood ONE COMMIT EARLIER, and reject the
  # push if any of them already passed there. Proves a test actually caught
  # its bug before the fix landed, instead of testing.md's red-before-green
  # discipline staying documented but unenforced (the Treadset gap, 2026-07-09).
  # Staged pre-push so it only runs on `git push`, never on every commit.
  - repo: local
    hooks:
      - id: red-before-green-pre-push
        name: Newly-added tests fail before their fix (red-before-green)
        entry: exophial-red-before-green
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

  # tdd-trailer: every commit message must carry a Tested-Behavior: or
  # TDD-Exempt: trailer (pebble exo-8d1.4). Makes the testing-doctrine
  # trailer convention load-bearing instead of merely documented -- the
  # exact gap the Treadset incident (2026-07-09) exposed: the taxonomy was
  # documented in testing.md but nothing mechanically required the trailer.
  # The script is installed by `exophial init` at scripts/git-hooks/
  # tdd-trailer.sh; this hook only fires on the commit-msg stage.
  - repo: local
    hooks:
      - id: tdd-trailer
        name: "Commit message carries a Tested-Behavior: or TDD-Exempt: trailer"
        entry: scripts/git-hooks/tdd-trailer.sh
        language: script
        stages: [commit-msg]

  # check-subtree-edits: a commit that touches a tracked subtree path (per
  # subtrees.tsv, read via exo-f66's shared exophial.subtrees.parse_subtree_prefixes)
  # must carry a `git-subtree-dir: <prefix>` trailer -- the marker
  # `git subtree merge`/`pull` (and `exophial subtree sync`) write
  # automatically, so a hand-edit inside a tracked prefix is caught before it
  # breaks the reconciliation base chain
  # (docs/decisions/2026-07-14-exophial-owned-subtree-sync.md Q3). Ported from
  # mtm's scripts/git-hooks/check-subtree-edits.sh (pebble exo-981.7); the
  # script lives at src/exophial/hooks/check_subtree_edits.py, exposed as the
  # exophial-check-subtree-edits console script (mirrors claude-md-coverage
  # above). Runs at commit-msg like tdd-trailer -- the commit message text is
  # only available at that stage. A no-op in a repo with no subtrees.tsv.
  - repo: local
    hooks:
      - id: check-subtree-edits
        name: "Subtree-path edits carry a git-subtree-dir trailer"
        entry: exophial-check-subtree-edits
        language: system
        stages: [commit-msg]

  # session-trailer (exo-0be): stamp every commit with a Session-Id: trailer
  # naming the live claude session that produced it (read from the
  # CLAUDE_CODE_SESSION_ID env var every claude invocation carries), alongside
  # the existing Co-Authored-By trailer -- so a landed commit's own message
  # names the session behind it instead of that reasoning surviving only in a
  # raw session transcript. Never rejects a commit: a process with no live
  # session id (a human's plain shell) is a silent no-op. Runs at commit-msg
  # like tdd-trailer/check-subtree-edits above, since the commit message text
  # it stamps is only available at that stage.
  - repo: local
    hooks:
      - id: session-trailer
        name: "Stamp every commit with the session that produced it"
        entry: exophial-session-trailer
        language: system
        stages: [commit-msg]

  # === Base hooks ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]


  # === Python: Ruff (lint + format) ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # === Python: MyPy (type checking) ===
  # `--strict` matches the bar exophial holds ITSELF to: `[tool.mypy] strict =
  # true` in its own pyproject ("Full --strict, matching the gateway/backtest
  # bar", codebase.md Code Quality) and `--strict` in its own scoped hook
  # (scripts/gates/check_mypy_scoped.py). Without it a provisioned repo runs
  # mypy at DEFAULT laxity -- untyped defs accepted, implicit Any everywhere --
  # so exophial was scaffolding a weaker standard than the one it enforces on
  # its own source.
  #
  # NOT added here: `--disallow-any-explicit`. `--strict` permits explicit
  # `Any` (disallow_any_generics bans only BARE generics like `dict`, never
  # `dict[str, Any]`). Closing that is right, but it is a per-module ratchet in
  # the target repo's own pyproject rather than a blanket flag -- exophial's
  # own migration measured 425 occurrences across 93 of 171 modules.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
        args:
          - --strict
          - --ignore-missing-imports
          - --no-error-summary



  # === JavaScript/TypeScript: ESLint + Prettier ===
  # Run from the root package.json's devDependencies (npm ci first). The
  # pre-commit mirrors install eslint in a separate env, where eslint.config.mjs
  # cannot import typescript-eslint. Prettier covers the TypeScript/JavaScript
  # sources only; docs, JSON and YAML are left as written.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix --max-warnings=0
        language: system
        files: \.(ts|tsx|js|mjs|cjs)$
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        files: \.(ts|tsx|js|mjs|cjs)$

  # === Rust: Formatting and linting ===
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: [--all, --]
      - id: clippy
        args: [--workspace, --, -D, warnings]

  # === Solidity: build and test with forge ===
  # The commit-boundary gate (`pre-commit run --all-files`, .exophial/config.yaml) runs the
  # forge suite, so an acceptance check needs no wrapper script to put forge in the grading
  # path. Under --all-files the hook runs whenever the repo holds a .sol file.
  # A fresh worktree has no lib/ submodules; without them forge installs them itself and
  # rewrites foundry.lock. `forge build` compiles script/ too: tests load some artifacts by
  # name with deployCode (for example FrostTestSigner), and `forge test` alone does not
  # compile those.
  - repo: local
    hooks:
      - id: forge-test
        name: forge build and test
        entry: bash -c 'git submodule update --init --recursive --quiet && forge build && forge test'
        language: system
        pass_filenames: false
        files: \.sol$|^foundry\.(toml|lock)$
      - id: check-deployed-contract-sizes
        name: EIP-170 deployed-contract size gate (24,576 B runtime)
        entry: python3 scripts/check-deployed-contract-sizes.py --script script/Deploy.s.sol --limit 24576
        language: system
        pass_filenames: false
        files: \.sol$|^foundry\.(toml|lock)$
      - id: check-adjudicator-deploy-linked
        name: real deploy on local anvil, libraries linked
        entry: python3 scripts/check-adjudicator-deploy-linked.py --script script/Deploy.s.sol
        language: system
        pass_filenames: false
        files: \.sol$|^foundry\.(toml|lock)$
