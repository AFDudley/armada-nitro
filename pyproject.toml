# The repo's Python: the environment reconciler (env/reconciler, run inside the
# cerc/armada-nitro-env image's Python 3.11) and tools/. Standard library only
# except pyyaml (stack/scripts/base-key.py's YAML-canonicalisation path,
# pinned to stack/scripts/verify_base_key_python_versions.py's PINNED_PYYAML).
# This file declares the project so ruff and mypy check every tracked .py
# file with one configuration, and so `uv sync --locked` (environment_command,
# .exophial/gate/prepare-oracle-env.sh) gives spec-oracle grading's hermetic
# `.venv/bin/python3` the same PyYAML every interpreter base-key.py runs under
# needs -- a bare python3 under this uv project resolves to `.venv/bin`
# first, so a declared dependency is the only way that interpreter sees it.
[project]
name = "armada-nitro-env"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
# `from reconciler.x import y` resolves against env/; `from armada_job_helper import y`
# (the shared job runner helper, arn-895) resolves against scripts/.
mypy_path = "env:scripts"
explicit_package_bases = true
