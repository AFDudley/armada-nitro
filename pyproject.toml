# The repo's Python: the environment reconciler (env/reconciler, run inside the
# cerc/armada-nitro-env image's Python 3.11) and tools/. Standard library only; this
# file declares the project so ruff and mypy check every tracked .py file with one
# configuration.
[project]
name = "armada-nitro-env"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
# `from reconciler.x import y` resolves against env/.
mypy_path = "env"
explicit_package_bases = true
