coordination_repo: "/home/rix/code/git_puller/repos/armada-nitro"
poll_interval: 5
inspect_interval: 5

dispatcher:
  backend: omp
  max_workers: 5
  task_timeout: 3600

# Commit-boundary acceptance gate the integrator re-runs in-worktree for pebbles
# with NO linked spec (a linked spec is graded in-process by spec_oracle.run_spec).
gate:
  command: ["pre-commit", "run", "--all-files"]
  timeout: 1800

# Where `exophial spec generate` writes unified spec instances (repo-relative).
spec_dir: "contracts/specs"

# Config-owned model-routing policy for the intake spec derivation (exo-beb /
# worker-model ADR D3). `exophial error` / `exophial feature` / `exophial specify`
# route through `ops.typed_intake.resolve_derivation_model`, which loads THIS
# section and FAILS LOUD (`IntakeConfigError`) when it, or one of its three rows,
# is absent — the engine hardcodes no default model or budget. `tiers` maps an
# abstract tier name to a concrete model id; `thinking_budgets` maps the same
# tier names to an extended-thinking token cap; `routing` maps a MIL-STD-882E
# criticality severity to an abstract tier. Routine (negligible/marginal)
# filings route to the cheap `small` tier with a bounded thinking budget;
# high-criticality (critical/catastrophic) filings route to `frontier`.
intake_derivation:
  tiers:
    small: "sonnet"
    frontier: "opus"
  thinking_budgets:
    small: 4000
    frontier: 31999
  routing:
    negligible: small
    marginal: small
    critical: frontier
    catastrophic: frontier

# Config-owned worker-model routing (exo-a98 / worker-model ADR D2/D3). At
# PROVISION/SPAWN the dispatcher reads the pebble's derived difficulty class and
# sets the worker's model from THIS table — so an autonomous worker NEVER inherits
# ~/.claude's interactive session default (whatever the operator last picked with
# `/model`). No model id is hardcoded in engine code: abstract `tiers` map to
# concrete ids here, and `routing` maps a difficulty class to a tier. The table
# MUST carry an explicit `default` routing row — a MISSING `worker_model` section
# or `default` row FAILS LOUD rather than letting the worker inherit. Difficulty
# banding from V_spec (ADR D1) is not built yet, so every pebble routes `default`
# today; the extra tiers/rows activate for free once specs commit a difficulty_class.
# Tier values are FULL model ids (not CLI aliases like `sonnet`): the claim-time
# context-fit gate sizes each worker against omp's catalog entry for it
# (context_fit_gate.omp_route: a Claude backend's model is `anthropic/<id>`).
worker_model:
  tiers:
    default: "pool/5090"
    frontier: "claude-opus-5"
  routing:
    default: default

# The ONE LLM transport this deployment reaches a model through (exo-698c / ADR
# docs/decisions/2026-07-16-llm-transport-seam.md). Config-selected, fail-loud: a
# MISSING `llm_transport` row makes the seam raise rather than guess a default, and
# no call site outside `llm_transport.py` names how to reach a model. The seeded
# default `claude_cli` backend (exo-df5) runs `claude --print` over OAuth — no API
# key, no `cli_path`, no `omp`, no `bun` — so a freshly provisioned target reaches
# a model with nothing host-specific written into this file. `omp_rpc` (exo-f1c)
# drives `omp --mode rpc`, routing judgment through any omp-configured provider
# (anthropic, a local vllm/qwen model, ...) with json_schema-constrained structured
# output on every model, keyless via omp's auth-broker credential vault (`omp
# auth-broker`, `omp token`) even on headless hosts; it needs `cli_path` set to a
# built omp-structured `dist/cli.js` and `omp` installed. `anthropic_sdk` is the
# API-key-gated alternative (it cannot honor a json_schema request — it raises,
# never degrades). `vllm` (exo-6391) routes low-criticality judgment to a local
# vLLM/OpenAI-compatible server (e.g. a local Qwen model) instead of Claude; it
# honors json_schema via vLLM structured outputs.
llm_transport:
  backend: claude_cli
  # model: ""        # optional per-backend model/tier override
  # executable: ""   # optional claude_cli binary override (default "claude") / omp binary override (default "omp")
  # provider: ""     # omp_rpc only: omp provider (e.g. "anthropic", "vllm")
  # base_url: ""     # vllm only: server address (default http://localhost:8000/v1)
  # cli_path: ""     # omp_rpc only: built omp-structured dist/cli.js (required for that backend)

# Per-tier omp tool allow-list (exo-b668/exo-3be), passed to the worker as --tools.
# The pool/5090 qwen worker reread files with `read` until its context overflowed
# (arn-bcc: one file 43 times, peak 161k tokens); with only bash/grep/glob it reads
# and writes files through bash.
workers:
  default:
    tools: [bash, grep, glob]
