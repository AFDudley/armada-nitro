status: completed
pebble_id: arn-e16
summary: >
  Added N6: src/apps/BattleshipForceMoveApp.sol, a channel app that extends
  ZkForceMoveApp. Its stateIsSupported overrides and, before calling the
  inherited Groth16 check (super.stateIsSupported), requires the candidate's
  stake (public input 5), board commitment (public input 2), and commitment
  chain (candidate input 0 == proof[0] input 1) to match proof[0]; otherwise
  it reverts with 'BattleshipForceMoveApp: stake changed',
  'BattleshipForceMoveApp: board changed', or
  'BattleshipForceMoveApp: commitment chain broken'. Added
  test/BattleshipForceMoveApp.t.sol (BattleshipForceMoveAppTest) with five
  tests: the ZkForceMoveApp inheritance, the three revert paths (stake,
  board, chain), and the valid two-move chain (hit.json as proof[0],
  miss.json as candidate). Added test/helpers/BattleshipAppFixture.sol to
  load the committed Battleship fixtures (vkey.json, hit.json, miss.json).
  Added scripts/forge_full_suite.sh (the declared new entrypoint for the c6
  acceptance gate): it runs `forge build` and `forge test`, parses the JSON
  results, and prints {"failed": <n>} to stdout with exit code 0. Verified:
  `forge test --match-contract BattleshipForceMoveAppTest` passes all 5
  tests, and `bash scripts/forge_full_suite.sh` exits 0 and emits
  {"failed": 0} on a clean stdout (forge's build/test output is steered to
  stderr so the gate's stdout_json parse sees pure JSON).
cost: "~60k tokens (N6 implementation: BattleshipForceMoveApp.sol, the
  fixture loader, five tests, and the c6 acceptance script; forge build +
  full suite green)."
