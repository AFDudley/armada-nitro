status: completed
pebble_id: arn-fb9.1
summary: >
  Fixed env/reconciler/tools/adopt_target.py: its per-module field lookup was
  keyed by the target name while the required-key table was keyed by the manifest
  name, so weth and armada_nitro produced an empty adopt entry and aave never
  carried waUSDC. Rebuilt the mapping as explicit (out_field, manifest_key,
  source_field) triples so every one of the seven modules carries its manifest
  addresses into its adopt entry; armada_nitro's groupKeyX/Y are derived from the
  scalar via cast wallet exactly as the module's adopt-verify does, and
  groupKeyScalar/revocationDelay are optional so a lighter real deploy manifest
  (the e12 fixturenet, which records only the three custodian addresses) also
  converts. Regenerated env/targets/fixturenet-adopt.json from the committed
  sample manifest with the tool (it had been hand-written and did not match the
  tool's output). Added the four spec-declared check entrypoints under
  env/reconciler/tests/ (check_address_conservation, check_lido_relaxed_fields,
  check_golden_regeneration as metamorphic-conservation measurements over the
  tool's output; check_missing_module_error as a behavior probe of the tool's
  refusal of a manifest missing lido) plus the sample-manifest-missing-lido
  fixture. Branch is based on the arn-fb9 epic lane tip (sibling arn-fb9.2 already
  landed there), so this is the final leaf that carries the wave to main.
cost: "~1 session, opus"
