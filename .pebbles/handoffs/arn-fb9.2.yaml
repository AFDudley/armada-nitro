summary: >
  Fixed the adopt deploy-standin suite so it runs as the spec invokes it --
  `python3 scripts/run_adopt_standin_suite.py` from the repo root with no
  PYTHONPATH. Both scripts/run_adopt_standin_suite.py and
  scripts/run_adopt_standin_mutated.py imported tests.reconciler... (repo root)
  and transitively reconciler... (env/) without putting either on sys.path, so
  they only worked under PYTHONPATH=env:. They now bootstrap sys.path from
  __file__. Also cleaned tests/reconciler/test_adopt_deploy_standin.py: removed
  the dead patched_apply branch and unused locals (ruff), annotated
  _FIXTURE/_build_context/_test_adopt_path (mypy --strict), reformatted
  (ruff-format), and reworded the docstring so the file names neither Sepolia nor
  a funding call (the spec's grep_absent scope check). Because the exophial
  existing-suite gate re-runs `pre-commit run --all-files` over the whole tree and
  the integrated base was already red, this branch also greens two pre-existing,
  untouched failures: frost-signer's clippy lints (cargo clippy --fix, no behavior
  change) and adopt_target.py's ruff-format wrapping (format only). `pre-commit run
  --all-files` now exits 0.
