status: completed
pebble_id: arn-40f
summary: >
  arn-40f: MultiAssetHolder._transferAsset now pays out ERC20 assets via
  SafeERC20 (line 461: IERC20(asset).safeTransfer(destination, amount)
  instead of bare transfer), so a token whose transfer returns false reverts
  the whole payout and value is conserved. Added test/PayoutConservation.t.sol
  (test_returnsFalse / test_returnsTrue / test_returnsNothing) which drives a
  finalized channel holding a test token and pays it out to an external
  destination, asserting the channel-holdings-plus-destination-balance total is
  invariant. Added the acceptance script
  scripts/check-adjudicator-payout-conservation.py that runs those tests.
  Verified end to end: the acceptance script runs the forge tests; c1
  (--token returns-false) returns {"returns-false": true} exit 0, and c2
  (--token returns-true --token returns-nothing) returns
  {"returns-true": true, "returns-nothing": true} exit 0. A red-first
  discrimination check confirmed the c1 test fails (exit 1, {"returns-false":
  false}) when the SafeERC20 fix is absent and passes (exit 0) when present,
  so the gate can say NO.
cost: "~40k tokens"
