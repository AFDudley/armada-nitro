summary: >
  Fixed MultiAssetHolder.deposit so the recorded holdings increase for an
  asset/channel never exceeds the tokens the adjudicator actually received:
  the ERC20 path now reads the adjudicator's own token balance before and
  after the safeTransferFrom and credits holdings by that measured increase,
  reverting the deposit when a token delivers less than the requested
  amount. Added test/DepositAmount.t.sol (test_shortTransfer_depositReverts
  for c1, test_normalDeposit_holdingsDeltaEqualsBalanceDelta for c2) and the
  arn-0cf acceptance script scripts/check-adjudicator-deposit-amount.py.
  Verified end to end: the acceptance script ran the two forge tests and
  printed the required JSON line (short_transfer_deposit_reverted=true,
  normal_deposit_holdings_delta_equals_balance_delta=true, exit 0); the full
  forge suite (29 tests across 5 suites) passed after the deposit change, so
  no regression.
cost: "~59k tokens (deposit fix, the two-scenario test, the acceptance
  script, pre-commit lint fixes, and the live forge gate run)."
