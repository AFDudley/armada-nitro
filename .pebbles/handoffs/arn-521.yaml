status: completed
pebble_id: arn-521
summary: >
  Closed the slither reentrancy finding on depositFromNote by adding a
  per-channel holdingsLock counter to MultiAssetHolder and checking it in
  every holdings-mutating entry point: deposit, depositFromNote, transfer,
  transferAllAssets, concludeAndTransferAllAssets and reclaim. Each checks
  the lock is clear, sets it before any external call (or, for
  concludeAndTransferAllAssets, before delegating internally into
  transferAllAssets's shared locked body _transferAllAssetsBody), and
  clears it on exit, so a reentering token/pool callback or any other
  nested call on the same channel reverts with 'Re-entered while in
  progress' instead of silently overwriting the outer call's write (commit
  538562f, carried over from the prior attempt). This dispatch's own work
  was making the two acceptance-spec scripts conform to the spec's
  metamorphic output contract: stdout must be exactly one JSON object
  {"flows": [...]} (inflows negative, outflows positive, sum(flows) <=
  1e-9 passes), with all forge output on stderr. test/ReentryDeposit.t.sol
  now emits the observed plain/hooked final holdings via
  console.log("ARN521_C1", plain, hooked); test/ReentryGuard.t.sol
  captures channel holdings immediately before and after each of the six
  nested-call attempts and emits console.log("ARN521_C2 <fn>", before,
  after) per entry point. scripts/check-adjudicator-reentry.py runs
  `forge test --match-contract ReentryDepositTest -vvv`, parses the
  ARN521_C1 line, and prints {"flows": [plain, -hooked]} (0 when the hook
  leaves holdings unchanged). scripts/check-adjudicator-reentry-guard.py
  does the same for the six ARN521_C2 lines, printing one flow per entry
  point as (before - after) (0 when the guard rejects the nested call).
  Verified by running both scripts directly: c1 prints
  {"flows": [100000000, -100000000]} (sum 0, exit 0); c2 prints
  {"flows": [0, 0, 0, 0, 0, 0]} (sum 0, exit 0). Ran the full suite
  (`forge build && forge test`): 34/34 tests pass (27 pre-existing plus
  the 7 reentrancy tests), confirming no regression to
  deposit/transfer/conclude/challenge/reclaim behavior. On the base tree
  (no holdingsLock guard, and these test/script files absent) both checks
  fail: the scripts/tests don't exist pre-guard, and even if copied over,
  ReentryGuardTest fails to compile against a MultiAssetHolder without
  holdingsLock, so the base replay produces a non-zero exit on both
  checks as required.
