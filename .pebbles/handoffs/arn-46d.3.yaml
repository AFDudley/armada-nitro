summary: >-
  Made a fixturenet base-snapshot restore compare the recorded .key lines against
  a fresh stack/scripts/base-key.py run and refuse on any difference, naming each
  differing line. Added a `check_restore_key_diff` helper to
  stack/scripts/fixturenet-base-common.sh (runs base-key.py, reads the recorded
  non-# lines from the snapshot's .key file, returns 0 on a match / 1 on refusal
  with the differing lines named), wired it into the warm path of
  stack/scripts/fixturenet-new (refuses the restore with a non-zero exit when the
  recorded lines differ), and added scripts/check_restore_key_diff.py which drives
  the repo's own restore comparison. Verified all three acceptance cases: an
  unchanged snapshot (recorded lines equal the fresh output) is accepted; after
  changing one recorded line the restore is refused (non-zero exit) and the refusal
  names the changed line while hiding unchanged lines. All three spec tests pass.
