summary: >
  Added the N4 ZkForceMoveApp: a generic IForceMoveApp (src/apps/ZkForceMoveApp.sol)
  that accepts a channel state only when it carries a valid Groth16 proof, verified
  against the pool's existing Snark library (armada/privacy-pool/types/SnarkTypes.sol)
  with a verifying key fixed at deployment, over public inputs bound to the state.
  Proved the wiring with a real Groth16 proof for the trivial y = x*x circuit
  (x=3, y=9; the circom source, verification key, proof, and public inputs are
  committed under test/fixtures/zk-app/trivial/). The forge test
  (test/ZkForceMoveApp.t.sol) asserts: a valid proof is supported; a wrong public
  input, a mangled proof, and a proof array whose length is not 1 are each refused.
  Verified by hand: forge test --match-path test/ZkForceMoveApp.t.sol passes 4/4;
  the four gate scripts (check_zk_forcemove_app.sh valid/wrong_public_input/
  mangled_proof/bad_proof_array_length, check_zk_forcemove_scope.sh, and
  check_forge_suite.sh) all emit the expected JSON ({"supported": true},
  {"supported": false} x3, {"forbidden_changes": 0}, {"total": 54, "skipped": 4,
  "failed": 0}); the whole forge suite is green (50 passed, 0 failed, 4 skipped)
  after fixing the foundry.toml Poseidon library path (M8 moved it to
  privacy-pool/types/PoseidonLibs.sol) and the ZkAppFixture VerifyingKey construction
  (added the artifactsIPFSHash field). Pre-commit (ruff, ruff-format, mypy, and
  the repo's local gates) passes on the changed files.
