summary: >
  Built the armada-watchtower-e2e fixturenet gate (E15b). The job definition
  (stack/compose-jobs/docker-compose-armada-watchtower-e2e.yml) is registered
  in stack/stacks/armada-nitro-fixturenet/stack.yml; it mounts armada_env at
  /env and runs the scenario inside the job container: the orchestrator
  (stack/scripts/armada-watchtower-e2e-job.py) builds the two real-proof
  channel deposits via env/gates/watchtower/prepare.ts, then runs the on-chain
  scenario (script/WatchtowerScenario.s.sol) for both scenarios, then prints
  the single JSON line. The thin host runner (stack/scripts/armada-watchtower-
  e2e.py) calls laconic-so run-job for the job on E12 and relays the job's
  JSON line unchanged, reaching the deployment only through laconic-so run-job
  + geth RPC at 127.0.0.1:8545 (never reading/writing the deployment's data
  files). Verified end to end against the live fixturenet: scenario A (watcher
  on) pays 1990000 lamports (state N+1's 2000000 net of the 50bps shield
  fee), scenario B (watcher off) pays 995000 (state N's 1000000 net of the
  fee); every c4 acceptance field holds, and all six grep clauses (c1 c2 c3
  c5 c6 c7) pass.
cost: "~120k tokens (repo/deployment/laconic-so investigation, the job job
