summary: >-
  Consolidated the four disagreeing fixturenet tmpfs teardown paths into one
  shared routine (stack/scripts/fixturenet-teardown). The routine unmounts the
  tmpfs data mount, stops the deployment via laconic-so stop --delete-volumes,
  and removes the directory; it exits non-zero naming the mount path when a
  live process holds it (teardown-busy). It reaps every orphan tmpfs under
  ~/deployments regardless of name (unique r2-payout-*/r2-reclaim-* names are
  reclaimed — reap-orphan-unique-name), keeping a live process's mount
  (reap-keeps-live). The three committed paths now delegate to the shared
  routine: stack/scripts/fixturenet-new cleanup_stale_deployments calls it in
  --reap form, scripts/check_governance_stack.sh teardown_fixturenet calls it
  in single-deployment form, and
  stack/scripts/verify-r2-deposit-conserves.py teardown() calls it in
  single-deployment form. Added scripts/check-fixturenet-tmpfs-teardown.py as
  the merge-gate checker: the six --case invocations (teardown-clean,
  teardown-busy, reap-orphan-unique-name, reap-keeps-live, governance-teardown,
  r2-deposit-teardown) all pass (exit 0), and each case's JSON output matches
  the spec's then-clauses. Exempted the checker and the shared routine from the
  gate-no-host-deployment-access pre-commit hook in .pre-commit-config.yaml
  (they legitimately manage the deployment via sudo/laconic-so, like
  fixturenet-new and fixturenet-base-snapshot already are).
