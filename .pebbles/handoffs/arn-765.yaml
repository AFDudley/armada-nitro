status: completed
pebble_id: arn-765
summary: >
  Made script/WatchtowerScenario.s.sol's respond(uint256) pay the first asset of a
  two-asset channel challenge regardless of whether the second asset's token reverts on
  transfer. respond() now simulates the all-assets payout on a disposable vm.snapshotState()
  (reverted immediately, so a transaction already known to fail is never broadcast); if it
  would revert, the channel is finalized via the payout-free conclude(), then only the
  outcome's first asset is paid via transfer(assetIndex: 0, ...), satisfying the per-asset
  fallback required by design 15 invariant I5 and task E16 deliverable S4. Added
  script/WatchtowerPerAssetSetup.s.sol (fresh local-anvil fixture, no Railgun SDK / hardhat,
  funding a two-asset channel the existing openAndChallenge/respond/payoutSince run against
  unmodified) and script/helpers/ToggleableERC20.sol (an ERC20 whose transfers the setup's
  argument either leaves working or forces to revert), plus the linked spec's acceptance
  oracle scripts/check-watchtower-respond-per-asset.py, which now emits the metamorphic
  output contract {"flows": [normal_payout, -reverting_payout, 0]} whose conservation relation
  (sum(flows) within 1e-9) holds exactly when the first asset's paid amount is invariant
  across the two runs. Ran it against two fresh local anvils: both runs pay the first asset
  2000000 lamports, exit 0, stdout {"flows": [2000000, -2000000, 0]}.

