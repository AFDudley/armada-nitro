status: completed
pebble_id: arn-451
summary: >-
  Made MultiAssetHolder.transfer and reclaim move a finalized channel's collateral
  through Armada pool commitments instead of a raw uint256 balance. transfer() now
  calls a new virtual _settleTransferExit hook (ArmadaNitroAdjudicator spends
  holdings[asset][channelId]'s current commitment and mints fresh owned commitments
  via pool.transactOwned: one per non-zero, non-SHIELD exitAllocation, plus a
  remainder commitment back to the adjudicator on a partial payout; a full payout
  leaves the holding at bytes32(0)). reclaim() calls a new virtual
  _settleReclaimExit hook that spends the target channel's current commitment (if
  any) and mints a fresh one worth its prior heldValue plus the guarantee amount.
  ArmadaNitroAdjudicator._executeSingleAssetExit no longer calls _transferAsset for
  an external destination; SHIELD allocations still pull real ERC20 via
  pool.shield, and other allocations mint an un-nullified owned commitment through
  the same pool.transactOwned primitive. IArmadaPool gained merkleRoot()/
  treeNumber() getters the adjudicator needs to bind its transactOwned
  transactions; MockPool/NoopPool got stub implementations. The three existing
  ArmadaNitroAdjudicatorTest settlement tests and PerAssetExitS4Test's two tests
  that asserted the custodian's raw ERC20 balance were updated to assert the
  custodian's balance is unchanged and a fresh pool commitment exists instead
  (matching clause c5). Verified by adding and running the five acceptance tests
  (test_transfer_partial_pays_destination_fresh_commitment,
  test_transfer_partial_leaves_fresh_remainder_commitment,
  test_transfer_full_payout_zeroes_holding,
  test_reclaim_raises_target_heldValue_by_guarantee_value,
  test_exit_external_destination_pays_commitment_not_raw_asset) against the real
  PrivacyPool fixture, by running forge test --match-contract
  MultiAssetHolderCommitmentTest and --match-contract ArmadaNitroAdjudicatorTest,
  and by running forge build and the full forge test suite (58 passed, 4 skipped,
  0 failed).
