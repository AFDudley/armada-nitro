status: completed
pebble_id: arn-3ef
summary: >
  Deployed the fixturenet's hub custodian with the FROST group public key (X, Y)
  read from a frost-signer key file in the deployment's state directory, instead of a
  single held scalar. env/targets/fixturenet.json now carries the custodian's group
  key as a key-file parameter (`groupKeyFile`, a path into the state dir) in place of
  the old `groupKeyScalar` setting. The armada_nitro reconciler module reads that key
  file (JSON with x, y) and deploys HubCustodian with that X, Y, recording the group
  key (groupKeyFile, groupKeyX, groupKeyY) in the manifest. A new gate
  (env/gates/hub-custodian-frost/verify.py) verifies the deployed custodian's group key
  equals the file's (the positive case passes end-to-end on the running fixturenet), and
  re-checking against a different key file makes the reconciler's verify fail with a
  message naming which group key value it expected (the other file's X, Y) and which it
  found (the on-chain X, Y).
cost: "~60k tokens"
