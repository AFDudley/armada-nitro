verify_transcript:
  hooks:
    - name: "python3 env/gates/hub-custodian-frost/verify.py match -> {config_uses_keyfile_param:true, onchain_key_matches_file:true, manifest_records_key:true, overall_positive_case_passed:true}"
      outcome: passed
      duration_s: 0.4
    - name: "python3 env/gates/hub-custodian-frost/verify.py mismatch -> {verify_exit_code:1, failure_names_mismatch:true}"
      outcome: passed
      duration_s: 0.4
