summary: >
  Proved, through two fixturenet demonstrations, that the watchtower's dispute-response
  gate discriminates. (a) single-signer: the watcher answers with a state signed only by
  the user; the on-chain response reverts and scenario A's payout check fails (c1).
  (b) late-response: the watcher answers after the challenge window; the response reverts
  and the payout still equals state N (c2). Both discrimination scenarios ran in scratch
  copies (anvil forks of the E12 fixturenet, reverted after) so the original fixturenet
  state is unchanged (c3). Both discrimination runs print their failure lines (c4). The
  normal, both-parties-signed, in-window answer is accepted and pays out as expected,
  showing the discrimination checks did not change the watchtower's normal behavior (c5).
  I verified all five spec clauses by running each acceptance script end-to-end against the
  live fixturenet E12: c1 single_signer -> response_reverted=true,
  scenario_a_payout_check_failed=true; c2 late_response -> response_reverted=true,
  payout_equals_state_n=true; c3 scratch isolation -> canonical_state_unchanged=true;
  c4 failure lines -> both failure_line fields non-empty; c5 normal ->
  normal_response_accepted=true, payout_updated_correctly=true. Built on the E15b job
  (armada-watchtower-discrimination-e2e) so the scratch copies are anvil forks of E12,
  never a stop/reset of E12.

cost: >
  ~60k tokens (reading the wip capture and E15b job, running all five spec acceptance
  scripts against the live E12 fixturenet, and composing the handoff).

