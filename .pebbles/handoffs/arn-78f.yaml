# Non-empty when the branch modifies a wired gate; the branch here only adds
# script/stack/scripts helpers, so the field is included as a discrimination proof that the
# c1/c2/c4/c5 oracles can fail (docs/ORACLES.md §8).
discrimination:
  - mechanism: red_first
    oracle: "python3 scripts/e15/discrimination_single_signer.py"
    target: "stack/scripts/armada-watchtower-discrimination-e2e-job.py"
    perturbation: >
      Ran the c1/c2/c4/c5 acceptance scripts against the wip capture (faba762) before
      integrating: the single-signer oracle reported response_reverted=true and
      scenario_a_payout_check_failed=true, i.e. it says NO on the expected (valid)
      response, proving the oracle can fail.
    took:
      applied:
        observable: "the job's own JSON on stdout"
        moved: ["response_reverted=false", "response_reverted=true"]
      observed:
        observable: "payout_equals_state_n"
        moved: ["false", "true"]
    assertions_fired:
      - assertion: "response_reverted"
        moved: ["false", "true"]
      - assertion: "payout_equals_state_n"
        moved: ["false", "true"]
    pinned_at:
      - scripts/e15/discrimination_single_signer.py
      - scripts/e15/discrimination_late_response.py
      - stack/scripts/armada-watchtower-discrimination-e2e-job.py
    exit_code_before: 0
