blocker: >
  ArmadaCrowdfund.sol declares `uint256 public constant WINDOW_DURATION = 21 days;`
  with no constructor parameter or deploy-time override anywhere in the deploy
  scripts (lib/armada-poc/scripts/deploy_crowdfund.ts only configures
  `_openTimestamp`, which sets windowEnd = openTimestamp + WINDOW_DURATION, never
  WINDOW_DURATION itself). ArmadaCrowdfund.finalize() requires
  `block.timestamp > windowEnd`. On the real fixturenet (go-ethereum + lighthouse,
  not Anvil/Hardhat), block.timestamp advances only with real wall-clock time --
  there is no evm_increaseTime/anvil_setCode/hardhat_impersonateAccount style
  RPC to fast-forward it (confirmed against this repo's own comments:
  env/gates/governance-stack/deploy_crowdfund.ts and docs/ENVIRONMENT.md both
  document real geth's lack of these dev-node RPCs; the existing
  armada-nitro-e2e and watchtower gates instead literally `sleep` out real
  challenge windows, but those windows are tens of seconds, not 21 days).
  The acceptance spec's behavior tests (contracts/specs/derived-arn-da4.spec.json,
  clauses c4-c7) run `governance-lifecycle.sh --report-json` with a 1800-second
  timeout and expect `finalize()` to have already succeeded by the time the
  script reports. That is structurally impossible against the real, unmodified
  ArmadaCrowdfund contract within any timeout under 21 days (≈1,814,400s).
next_action: >
  This needs a product/spec decision, not more engineering: either (a) approve
  a short-window test build of ArmadaCrowdfund specifically for this gate (e.g.
  a thin fork with WINDOW_DURATION shortened to minutes, deployed only by
  governance-lifecycle.sh, never by the production deploy scripts) -- this
  would be a deviation from "the real G1-G6 contracts" that the brief's
  constraints explicitly rule out without sign-off, so I did not do it
  unilaterally; or (b) relax contracts/specs/derived-arn-da4.spec.json's
  behavior-test timeout to something that can span 21 real days (e.g. a
  long-running scheduled job rather than a synchronous 1800s gate check); or
  (c) identify an actual time-travel mechanism on this fixturenet's geth/
  lighthouse pair that I missed (I checked SLOT_DURATION_MS in
  stack/compose/docker-compose-armada-fixturenet.yml -- it couples 1:1 with
  real wall-clock slot timing, so a shorter slot does not shorten 21 real
  days). Once one of these is decided, env/gates/nitro-e2e/governance-lifecycle.sh
  and script/GovernanceLifecycle.s.sol are otherwise complete and compile
  clean; only the wait-for-windowEnd step needs to change.
