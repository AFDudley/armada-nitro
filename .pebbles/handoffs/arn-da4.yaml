summary: >
  Added script/GovernanceLifecycle.s.sol (a forge script matching
  LocalScenario.s.sol's structure: fund -> finalize -> claim -> sponsor -> vote
  -> report phases for the first half of the Baal governance lifecycle) and
  env/gates/nitro-e2e/governance-lifecycle.sh (a new sibling gate step that
  reuses scripts/check_governance_stack.sh to stand up the real G1-G6 stack on
  a fresh fixturenet, then drives the scenario and emits the report JSON).
  env/gates/nitro-e2e/prepare.ts is untouched. Verified: `forge build` compiles
  the new script cleanly against the real ArmadaCrowdfund/ArmadaToken/
  MockUSDCV2/PrivacyPool/Baal/Safe contracts (lib/armada-poc, with submodules
  populated via `git submodule update --init --recursive` to get there), and
  `bash -n` validates the gate script's syntax. The behavior acceptance tests
  (c4-c7, which require an actual fixturenet run) could not be executed and
  will not pass as specified: ArmadaCrowdfund.WINDOW_DURATION is a Solidity
  `constant` (21 days) with no deploy-time override in the real, unmodified
  contract, and finalize() requires block.timestamp > windowEnd. A real geth
  fixturenet (not Anvil) has no time-travel RPC -- this repo's own code
  (env/gates/governance-stack/deploy_crowdfund.ts's comments, docs/ENVIRONMENT.md)
  explicitly notes real geth lacks anvil_setCode/hardhat_impersonateAccount and
  the existing watchtower/nitro-e2e gates instead literally `sleep` out real
  challenge windows measured in tens of seconds, not three weeks. There is no
  way to reach `block.timestamp > windowEnd` within the spec's 1800s
  timeout other than literally waiting 21 real days. I also found and resolved
  a second, smaller blocker in the design (not a blocker to merge, just
  recorded for context): ArmadaCrowdfund.MIN_SALE is $1,000,000 and one
  committer cannot reach it alone (a hop-0 seed caps at $15,000), so fund()
  whitelists and funds 67 synthetic seed accounts to clear the floor -- this
  part is real and would work once the time blocker is resolved.
