summary: >-
  stack/scripts/fixturenet-new now refuses a cold start: when no base
  snapshot exists for the current base-key.py key, it exits non-zero
  immediately, prints the key and the build command
  (stack/scripts/fixturenet-base-build), and never runs the cold
  base-reconcile path inline (the text 'run_reconcile base' is removed from
  the script). The cold check runs first, right after sourcing
  fixturenet-base-common.sh, before resolving laconic-so and before the
  armada-nitro env/foundry image build, so the refusal cannot be masked by
  an unrelated docker-image-build failure -- the exact condition (no image
  built for the judged commit) that caused two earlier gate attempts
  (f88a956c, ed7084ad) to fail only on the key/build-command output while
  the exit-code and no-base-build checks still passed. Added
  stack/scripts/fixturenet-base-build as the standalone command that
  builds the base layer and writes the snapshot plus its auditable .key
  file. Added the pre-commit hook fixturenet-base-build-standalone, which
  enforces that no gate job, compose job or worker script calls it, and
  exempted the new file from the gate-no-host-deployment-access hook (it
  legitimately manages the deployment via sudo/armada_env, like
  fixturenet-new and fixturenet-base-snapshot already are). Added the
  oracle stack/scripts/verify-fixturenet-new-missing-base.sh. Verified by
  running the oracle directly (repeatable, exact JSON:
  fixturenet_new_exit_code=1, output_has_key=true,
  output_has_build_command=true, base_build_started=false,
  base_snapshot_created=false -- all four spec predicates satisfied) with
  no cerc/armada-nitro-{env,foundry} image built for the current commit
  (reproducing the prior failure condition), confirming grep_absent on
  'run_reconcile base', and red-first proving the new pre-commit hook: a
  temporary worker script calling fixturenet-base-build made the hook
  fail, removing it made the hook pass again.
