summary: >
  Added scripts/check-settlement-rate-free.py, a standing guard that scans
  src/ArmadaNitroAdjudicator.sol and every src/nitro/**/*.sol for ERC-4626
  imports and calls to the six rate-conversion functions (convertToAssets,
  convertToShares, previewDeposit, previewMint, previewRedeem, previewWithdraw).
  The default run prints JSON {files_scanned, erc4626_imports, rate_calls};
  against the current tree it reports files_scanned=16 with both finding lists
  empty, confirming design 15's rate-free settlement invariant holds today.
  The --self-test mode writes a temp .sol file containing "convertToAssets(",
  scans it, and reports self_test_detected=true, proving the scanner can
  recognize a violation rather than always reporting a clean result. Both
  behaviors were run and verified to print the expected JSON.
