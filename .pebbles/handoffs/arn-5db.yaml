summary: >
  E16 S6 (design 15, I4): made the rule "the adjudicator imports no ERC-4626
  interface and calls no exchange rate" enforced by `forge test` itself, instead of
  relying on a standalone script forge never runs. Added test/SettlementRateFree.t.sol:
  the forge suite runs two source-level assertions over the real adjudicator — the
  import-closure check reads the compiler artifact metadata and asserts no source in the
  closure names 4626, and the bytecode check scans the deployed adjudicator for a
  PUSH4 of each of the six ERC-4626 rate selectors (convertToAssets/convertToShares/
  preview*). A third test proves the scan actually fires on a rate call. Added
  scripts/check-settlement-rate-free-gate.py, the derived-spec c2 acceptance gate: it
  scans src/ArmadaNitroAdjudicator.sol and every src/nitro/**/*.sol for the five
  forbidden names (ERC4626, IERC4626, convertToAssets, convertToShares, preview). On a
  clean source it prints exactly one JSON object {"series": [[0, 0], [1, 1]] and exits
  0 (the monotonicity oracle parses that object and passes when y is non-decreasing as
  x increases); on a violating source it prints the hit to stderr and exits non-zero.
  Verified end-to-end: the c2 gate exits 0 on the real source, and exits 1 when
  convertToAssets is added to a scratch copy of the adjudicator source pointed at it.
  forge test passes for SettlementRateFreeTest (3/3) and the full suite is 31 passed, 2
  pre-existing failures (PerAssetExitS4, ArmadaNitroAdjudicator "no matching artifact")
  that fail identically at the base commit eee9692, so my branch adds 3 passing tests and
  introduces no new failures.

