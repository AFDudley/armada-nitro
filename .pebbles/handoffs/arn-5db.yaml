summary: >
  Made `forge test` itself enforce E16 S6 (the adjudicator imports no ERC-4626 interface
  and calls no exchange rate) instead of relying on the standalone check-settlement-rate-free.py
  that forge never runs. Added test/SettlementRateFree.t.sol (SettlementRateFreeTest): three
  tests - (1) the adjudicator's compiled-metadata sources list no path containing "4626", (2)
  the deployed adjudicator bytecode holds no PUSH4 of the six ERC-4626 rate selectors, and
  (3) the same bytecode scan positively finds a convertToAssets call in a helper contract.
  Added scripts/check-settlement-rate-free-gate.py, the c2 metamorphic gate: it runs the S6 test
  in a scratch copy of the repo. The before-state (real adjudicator source) passes 3/3; the
  after-state (injected IERC4626 import + convertToAssets call) makes the forge suite fail
  (1 passed, 2 failed). Ran the gate directly: before rc=0 (pass), after rc=1 (fail) -
  monotonicity holds. c1 also verified: git grep over test/ and src/ArmadaNitroAdjudicator.sol
  + src/nitro/ finds no ERC4626/IERC4626/convertToAssets/convertToShares/preview. Full forge
  suite: 31/33 pass (2 pre-existing failures in other reports, untouched here). Pre-commit
  (ruff, ruff-format, mypy, tdd-trailer, etc.) passes on the commit.
