summary: >-
  Component (d) of the R1 adjudicator rewrite: the deploy script
  (script/Deploy.s.sol, left unchanged) deploys and links the
  commitment-holdings library (a) and pool-spend library (b) into the new
  ArmadaNitroAdjudicator at deploy time. Brought in the library split and
  matching ArmadaNitroAdjudicator rewrite from the sibling worker/arn-a46
  branch (src/armada/libraries/CommitmentHoldings.sol, PoolSpend.sol),
  which forge script's --broadcast run deploys and links automatically via
  CREATE2 -- no deploy script carries an unlinked __$...$__ placeholder
  into production. Added the two spec-declared checker scripts:
  scripts/check-adjudicator-deploy-linked.py starts a fresh local anvil,
  deploys a local Armada pool, runs script/Deploy.s.sol against it with
  --broadcast, reads forge's own broadcast record for the deployed
  library/adjudicator addresses, and checks the deploy did not revert,
  both libraries have on-chain code, the adjudicator has on-chain code,
  and its runtime bytecode carries zero unlinked library placeholders;
  scripts/check-deployed-contract-sizes.py resolves every contract the
  deploy script deploys (its direct new/deployCode targets plus every
  external library those contracts link, read from each artifact's
  bytecode.linkReferences) and matches against `forge build --sizes
  --json`, failing if any exceeds the EIP-170 limit. Recorded a "Measured
  sizes" section in docs/tasks/R1-adjudicator-rewrite.md:
  ArmadaNitroAdjudicator 21,913 B runtime (2,663 B margin under the
  24,576 B limit), CommitmentHoldings 680 B, PoolSpend 6,392 B,
  ConsensusApp 2,337 B, HubCustodian 4,328 B -- closing the 982 B overage
  the Operator ruling recorded. Verified by running both new checker
  scripts against a real local anvil (both print the required JSON
  fields and exit 0), running `forge test` (73 passed, 0 failed, 4
  pre-existing skips), and confirming the pre-existing arn-578 EIP-170
  gate (scripts/check-contract-sizes.py) still exits 0 with
  oversized_count 0. pre-commit (ruff, ruff-format, mypy, forge build and
  test, EIP-170 contract size gate) all pass on the commit.
