status: completed
pebble_id: arn-61e
summary: >
  Rewrote ArmadaNitroAdjudicator.depositFromNote (src/ArmadaNitroAdjudicator.sol) so a deposit
  credits the channel from a fresh contract-owned note inside the Armada pool instead of an
  IERC20.balanceOf before/after delta on a raw unshield. After pool.transact returns, the
  adjudicator reads the single output commitment's preimage live via pool.preimageOf (never a
  caller-asserted value), requires its npk derive from address(this), its token be on isAsset,
  and its value equal the new cumulative holding (expectedHeld + note.value), then sets
  holdings[asset][channelId] to that commitment. The IERC20.balanceOf read is gone; the
  reentrancy guard and held == expectedHeld check are unchanged and still read held via
  heldValue. Added five tests to test/ArmadaNitroAdjudicator.t.sol
  (test_depositFromNote_creditsHoldingsToNewCommitment,
  test_depositFromNote_revertsOnValueMismatch, test_depositFromNote_revertsOnWrongOwner,
  test_depositFromNote_noRawTokenBalanceChange,
  test_depositFromNote_guardsReentrancyAndExpectedHeld) using a dedicated N2aPool test double
  (no-op transact, settable preimageOf registry) so each new check is exercised independently of
  the real pool's own token movement; updated the existing happy-path deposit test to the same
  double so its raw-balance assertion matches the new invariant. Removed
  test_shortTransfer_depositReverts (and its now-dead ShortToken double) from
  test/DepositAmount.t.sol: it pinned the removed IERC20.balanceOf delta check as the
  short-transfer defense, which this task explicitly deletes -- an obsolete-behavior test, not a
  regression. Added scripts/run-forge-suite.sh (the spec's declared new entrypoint for c6):
  runs the whole forge suite with --json and reports {total, skipped, failed}, exiting 0 iff
  failed == 0. Verified: forge build clean; forge test --match-contract
  ArmadaNitroAdjudicatorTest 15/15 pass; scripts/run-forge-suite.sh over the whole suite reports
  {"total": 61, "skipped": 4, "failed": 0} (the 4 skips are the pre-existing, documented
  fork-dependent watchtower tests, unrelated to this change). Spot-checked mutation sensitivity
  by hand: deleting the `preimage.value == amount` require makes
  test_depositFromNote_revertsOnValueMismatch fail with "next call did not revert as expected";
  deleting the `preimage.npk == address(this)` require makes
  test_depositFromNote_revertsOnWrongOwner fail the same way; both were restored before the
  final commit.
