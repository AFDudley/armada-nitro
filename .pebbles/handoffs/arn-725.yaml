summary: >
  Restored the armada-watchtower-e2e fixturenet gate so it runs entirely
  from the rebuilt env image (cerc/armada-nitro-env:local) with no
  dependency on the reaped worker worktree. The E15b job
  (stack/compose-jobs/docker-compose-armada-watchtower-e2e.yml) bound-mounted
  three source files (stack/scripts/armada-watchtower-e2e-job.py,
  script/WatchtowerScenario.s.sol, env/gates/watchtower/prepare.ts) from
  .worktrees/worker-arn-752, which exophial reaps when arn-752 lands.
  Fix: removed those three bind-mount lines (c1), so the job's code now
  comes from the image. I rebuilt the env image from this branch (lib
  submodules initialized so the contracts stage compiles), synced the E12
  deployment's job copy to the fixed definition, and ran the gate end-to-end
  against the live fixturenet E12. The e2e script's JSON now shows
  scenario_a (watcher on) paying 1990000 lamports (1500000 < x <= 2000000)
  and scenario_b (watcher off) paying 995000 lamports (0 < x < 1500000) —
  c2 and c3 all hold.
cost: >
