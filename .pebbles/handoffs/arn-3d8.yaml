status: completed
pebble_id: arn-3d8
summary: >
  Added a hub-configured asset list to ArmadaNitroAdjudicator (mapping
  configuredAssets, set from a new constructor address[] argument, exposed via
  isAsset(address)) and enforced it on both deposit entry points. The plain
  deposit is overridden on the adjudicator (override IMultiAssetHolder and
  MultiAssetHolder) to require isAsset(asset) before the shared
  MultiAssetHolder._doDeposit credits the channel; depositFromNote now
  requires isAsset on the note's token before submitting the unshield. All
  other call arguments stay identical between a listed-asset and an
  unlisted-asset deposit, so only the token's configured status flips credit
  to revert. script/Deploy.s.sol reads the hub's list from the ARMADA_ASSETS
  env var (comma-separated addresses). Added test/AdjudicatorAssetList.t.sol
  with one metamorphic test per entry point (listed credits, unlisted reverts
  with 'Asset not configured') and added scripts/check-adjudicator-asset-list.
  py as the spec's acceptance oracle: it runs the matching forge test and, per
  the metamorphic output contract, emits {"series": [[x, y], ...]} to stdout
  (unlisted x=0 -> y=0, listed x=1 -> y=1, monotonic) while routing forge's
  own output to stderr. Verified by running both spec gate commands directly
  (both exit 0 with valid JSON on stdout) and by running the full forge suite
  (19/20 pass; the single pre-existing failure ArmadaNitroAdjudicatorTest
  setUp 'no matching artifact found' also fails on the base tree and is out
  of scope for this pebble).
