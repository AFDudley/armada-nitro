summary: >
  The fixturenet gate now runs both base-key verify scripts. Added
  stack/compose-jobs/docker-compose-armada-fixturenet-gate.yml, a
  self-contained job registered in
  stack/stacks/armada-nitro-fixturenet/stack.yml that runs
  verify_base_key_python_versions.py and verify_base_key_docker_rebuild.py
  in order under `set -e`, so the gate exits non-zero when either script
  fails, and prints a line naming each script so a reader of the run output
  can confirm both checks ran. Added scripts/observe_fixturenet_gate.py,
  the linked spec's acceptance oracle, which runs the gate across
  both-pass, python-versions-fails, and docker-rebuild-fails scenarios and
  reports gate_exit_code / python_versions_ran / docker_rebuild_ran, plus
  the output-naming booleans under --report-output. Verified by running all
  five acceptance tests of contracts/specs/derived-arn-46d.5.spec.json
  (all PASS) and by the passing commit-boundary pre-commit gate.
