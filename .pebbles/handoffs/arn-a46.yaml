summary: >
  Added scripts/check-deploy-on-anvil.sh: a fast gate check that starts its own fresh
  local anvil (default EIP-170 24,576-byte limit, never disabled), deploys a local
  Armada pool via script/LocalArmada.s.sol, then runs the real script/Deploy.s.sol
  against it with libraries linked, broadcasting for real (forge script --broadcast
  --private-key), and reports {"reverted": bool, "adjudicator_code_present": bool} as
  JSON on stdout. Wired it into .pre-commit-config.yaml as a new check-deploy-on-anvil
  hook next to forge-test, firing on every .sol/foundry.toml/foundry.lock change (and
  on the check script's own changes), so the gate runs it on every chunk -- no
  fixturenet, no laconic-so stack, just a local anvil. Running the real deploy against
  an EIP-170-enforcing anvil reproduced the arn-d5a fixturenet failure directly: before
  any adjudicator-size fix, the check correctly reported reverted:false/
  adjudicator_code_present:false (new ArmadaNitroAdjudicator(...) silently failed to
  deploy because its runtime was 25,558 bytes, 982 over the limit) -- an oracle-says-NO
  result, so the acceptance test as a whole failed. Closing that was necessary for the
  check's own stated acceptance ("the deploy script ... does not revert"), so I did the
  R1 brief's library split: moved the commitment-holdings read (component (a)) into
  src/armada/libraries/CommitmentHoldings.sol and every pool.transactOwned spend
  (component (b)) into src/armada/libraries/PoolSpend.sol, both as public library
  functions (internal library functions inline and give no size relief) linked into
  the adjudicator at deploy time. ArmadaNitroAdjudicator's runtime is now 21,913 bytes
  (2,663-byte margin). Verified by: running scripts/check-deploy-on-anvil.sh directly
  (exits 0, {"reverted": false, "adjudicator_code_present": true}), running the full
  forge test suite (73 passed, 4 pre-existing conditional skips, 0 failed), running
  `pre-commit run check-deploy-on-anvil` and `pre-commit run forge-test` standalone
  (both Passed), and committing through the full pre-commit hook chain (all hooks
  green, including the tdd-trailer and claude-md-coverage hooks on the new
  src/armada/libraries/ directory). For the discrimination record, I temporarily
  swapped the committed ArmadaNitroAdjudicator.sol for the pre-fix (e6cafdbc) revision,
  re-ran the gate script, observed it report adjudicator_code_present:false (the
  acceptance test's required value is true, so the test fails on this input), then
  restored the committed file exactly (verified byte-identical to HEAD) before
  finishing.
