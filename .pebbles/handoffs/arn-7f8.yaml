summary: >
  Rewrote scripts/check-settlement-rate-free-gate.py so the c2 gate's pass/fail
  verdict is computed from the real execution of the enforcing forge test
  (forge test test/SettlementRateFree.t.sol) instead of an independent Python
  scan. The script now runs forge, parses the SettlementRateFreeTest suite's
  JSON, and only emits the monotonicity pass object ({"series": [[0, 0],
  [1, 1]], exit 0) when the enforcing tests actually ran and passed; when
  test/SettlementRateFree.t.sol is deleted, forge reports "no tests match"
  and the script exits 1. Verified in two throwaway copies of the repo: with
  the test file present the check passes (exit 0, same as today); with it
  deleted the check fails (exit 1), so deleting the enforcing test file is
  caught as a failure instead of a silent pass.
