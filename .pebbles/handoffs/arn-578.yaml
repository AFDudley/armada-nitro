summary: >-
  Added the EIP-170 contract-size gate to the commit boundary. New
  scripts/check-contract-sizes.py runs `forge build --sizes`, parses the
  sizes report itself (not forge's exit code), and exits non-zero when a
  contract a deploy script under script/ deploys has a runtime size above
  24,576 bytes. It reports which contracts are over the limit in a JSON
  stdout ({oversized_count, oversized[].contract}). Test harnesses no
  deploy script deploys (e.g. AdjudicatorHarness) are excluded. Wired into
  the gate as a local pre-commit hook (check-contract-sizes) in
  .pre-commit-config.yaml, running on .sol / foundry changes. Verified all
  five acceptance tests from contracts/specs/derived-arn-578.spec.json:
  a deployed contract at 24,577 B fails, at 24,576 B passes, the incident
  25,558 B report fails and names ArmadaNitroAdjudicator, and an oversized
  AdjudicatorHarness does not fail the check.
