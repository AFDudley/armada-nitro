services:
  nitro-railgun-deploy:
    image: cerc/nitro-railgun-foundry:local
    entrypoint: ["nitro-railgun-local"]
    command: ["deploy"]
    environment:
      CERC_ETH_RPC_ENDPOINT: ${CERC_ETH_RPC_ENDPOINT:-http://nitro-railgun-anvil:8545}
      CHALLENGE_DURATION: ${CHALLENGE_DURATION:-15}
      HUB_REVOCATION_DELAY: ${HUB_REVOCATION_DELAY:-60}
    volumes:
      - nitro_railgun_deployments:/app/deployments

volumes:
  nitro_railgun_deployments:
