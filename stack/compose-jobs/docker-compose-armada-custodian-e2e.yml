services:
  armada-custodian-e2e:
    image: cerc/armada-nitro-env:local
    # Mirrors docker-compose-armada-nitro-e2e.yml (host networking so 127.0.0.1:8545 resolves
    # to geth's host-published port; $$ escapes for a literal $ in the container environment).
    #
    # The difference (E14c): the hub custodian used here is freshly deployed under a real 2-of-3
    # FROST group (tools/frost-signer's deterministic trusted-dealer keygen), and the
    # delegate-authorization `execute` is signed with two real FROST shares (signers 1 and 3)
    # instead of the fixed single-scalar signer `armada-nitro-e2e` uses. Stage 1 reuses the
    # real-proof-funded deposit flow from env/gates/nitro-e2e/prepare.ts, bound to this fresh
    # custodian via HUB_CUSTODIAN_OVERRIDE. Stage 2 is script/CustodianFrostScenario.s.sol.
    #
    # frost-signer has no cargo/rustc in this image; the checker builds it on the host
    # (`cargo build --release --target x86_64-unknown-linux-musl`, portable across the host's
    # and this image's glibc) and this volume mounts it in at a fixed PATH location.
    network_mode: host
    working_dir: /src/armada-nitro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        # Gates spend test-account USDC (shields, channel deposits); top the accounts back up to
        # the funding target first (funding.py mints only the shortfall).
        (cd /src/armada-nitro/env && python3 -m reconciler \
          --target /src/armada-nitro/env/targets/fixturenet.json --rpc "$$HUB_RPC" \
          --state /env --key-file /env/deployer.key --only funding)

        # Circuits are baked into the image (docs/tasks/E9-operability.md); this verifies them
        # rather than downloading -- see docker-compose-armada-nitro-e2e.yml for the same step.
        (cd /src/armada-nitro/env && python3 -c "from reconciler.modules import armada; armada._ensure_circuits_fetched()")

        CHAIN_ID="$$(cast chain-id --rpc-url "$$HUB_RPC")"
        BCAST="broadcast/CustodianFrostScenario.s.sol/$$CHAIN_ID"

        run_script() {
          forge script script/CustodianFrostScenario.s.sol --sig "$$1" --rpc-url "$$HUB_RPC" --slow --ffi --broadcast
        }

        # ---- Step 1 (E14c c1, c6): deploy the custodian under a real FROST group; signers
        # {1,3} authorize the delegate through `execute` (frost-signer sign --format json via
        # forge's vm.ffi -- a real threshold signature, not a simulated one).
        mkdir -p "$$SHARES_DIR"
        frost-signer keygen --out "$$SHARES_DIR"
        run_script 'deployAndAuthorize()'
        CUSTODIAN="$$(cat deployments/custodian-e2e-custodian-address)"
        DELEGATE_ADDR="$$(cast wallet address --private-key "$$DELEGATE_KEY")"
        AUTH_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/deployAndAuthorize-latest.json")"
        IS_ACTIVE="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- Stage 1 (real-proof deposit, c3): prepare.ts builds a Groth16-proved
        # `depositFromNote` calldata bound to this custodian (HUB_CUSTODIAN_OVERRIDE) and writes
        # it to DEPOSITS_PATH.
        mkdir -p /src/armada-poc/scripts/gates
        cp /src/armada-nitro/env/gates/nitro-e2e/prepare.ts /src/armada-poc/scripts/gates/prepare.ts
        (
          cd /src/armada-poc
          MANIFEST_PATH="$$MANIFEST_PATH" \
          DEPOSITS_OUTPUT="$$DEPOSITS_PATH" \
          CHALLENGE_DURATION="$$CHALLENGE_DURATION" \
          HUB_CUSTODIAN_OVERRIDE="$$CUSTODIAN" \
          HUB_RPC="$$HUB_RPC" DEPLOY_ENV=local CCTP_MODE=real \
            npx hardhat run scripts/gates/prepare.ts --network hub
        )

        # ---- Step 2 (E14c c2, c3): fund the channel (real-proof deposit + custodian executes,
        # each FROST-signed), then the delegate + user cooperatively close it, shielding the
        # payout (isValidSignature/EIP-1271 accepts the delegate's signature).
        run_script 'cooperativeClose()'
        CLOSE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("concludeAndTransferAllAssets(")) | .hash' "$$BCAST/cooperativeClose-latest.json")"

        # c7: the Shield log's payout note equals the closed state's allocation net of shieldFee().
        if forge script script/CustodianFrostScenario.s.sol --sig 'verify()' --rpc-url "$$HUB_RPC"; then
          PAYOUT_OK=true
        else
          PAYOUT_OK=false
        fi

        # =============================================================================
        # E14d Step 3 (revocation) + Step 4 (rotation) + Discrimination
        # =============================================================================

        # ---- Step 3 (c1, c2, c6): signers {2,3} schedule `revokeDelegate` through `execute`
        # (FROST-signed). The delegate stays active until the revocation delay elapses; after
        # the delay it is inactive and a state it signs is rejected.
        run_script 'revoke()'
        REVOKE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/revoke-latest.json")"

        # c1: before the delay passes, the delegate is still active (isActiveDelegate == true).
        # c2: after the delay passes, the delegate is inactive (isActiveDelegate == false) and a
        # state it signs is rejected (c6). The job sleeps for the delay + a margin.

        # ---- Step 4 (c3, c4, c5, c7): signers {1,2} rotate the group key to a NEW FROST group
        # (frost-signer keygen --seed <other> -- a different keypair; the default seed unchanged).
        # c3: a signature from the old group is rejected after rotation.
        # c4: one signer cannot authorize alone (mixed-share sign fails; other group's valid
        #     signature reverts on execute with InvalidGroupSignature).
        # c5: replaying step 1's signed operation reverts on the nonce.
        # c7: a signature over a different operationHash reverts on execute (InvalidGroupSignature).

        # Evidence: each of these rejections is captured as the observed revert selector / tx hash.

        # ---- Evidence capture helpers (the observed rejection lines)
        # `exec_view` runs `cast call` for a group-authorized `execute` (view mode, no state
        # change); on a revert, the output is the revert data, whose first 4 bytes are the
        # selector (e.g. InvalidGroupSignature).

        # c2/c6: after the delay, the delegate is inactive; its signed state is rejected.
        # The job captures the observed rejection (isActiveDelegate false + isValidSignature
        # rejection) and the observed revoke tx hash.

        # c3: after rotation, a signature made by the OLD group's shares {1,3} is rejected.
        # c4: (i) one real share + one foreign share cannot sign (FROST rejects the foreign
        #       share); (ii) a valid signature by the other group's two shares reverts on execute.
        # c5: replay step 1's operation -- the nonce has advanced, so the same calldata reverts.
        # c7: sign over a DIFFERENT operationHash, then execute reverts (InvalidGroupSignature).

        # ---- c1: before the revocation delay passes, the delegate is still active
        STEP3_ACTIVE_BEFORE="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- c2/c6: wait past the revocation delay, then verify the delegate is inactive and
        # its signed state is rejected. The job sleeps for the delay + margin.
        sleep $((REVOCATION_DELAY + 5))
        STEP3_INACTIVE_AFTER="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- Step 4: signers {1,2} rotate the group key to the seeded group
        frost-signer keygen --out "$$NEW_SHARES_DIR" --seed 0x6e6974726f726170
        run_script 'rotate()'
        ROTATE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/rotate-latest.json")"

        # ---- Evidence capture: each rejection is captured as the observed revert selector / tx
        # hash. The job runs the failed `execute` calls via `cast call` (view mode, no state
        # change) and prints the named rejection lines.
        #
        # Helper `exec_call` runs the failed `execute` and returns the observed selector (the
        # first 4 bytes of the revert data, e.g. `InvalidGroupSignature`).
        exec_call() {
          local out
          out="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'execute(address,uint256,bytes,(uint256,uint256,uint256))' "$@" 2>&1 || true)
          # On a reverting call, the output is the revert data; the first 4 bytes are the
          # selector. If the call succeeded, no selector (empty).
          if grep -qE 'RWS: 0x[0-9a-f]{8}' <<<"$out"; then
            grep -oE 'RWS: 0x[0-9a-f]{8}' <<<"$out" | head -1 | sed 's/RWS: //'; return
          fi
          grep -oE '0x[0-9a-f]{8}' <<<"$out" | head -1
        }

        # Current nonce and a simple calldata (target = custodian self-call).
        NONCE="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'nonce()(uint256)' --rpc-url "$$HUB_RPC")"
        DATA_HEX="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'operationHash(uint256,address,uint256,bytes)' "$$NONCE" "$$CUSTODIAN" 0 "$$(cast abi-encode 'bytes' '')" 2>&1 || echo '')"

        # c3: after rotation, a signature made by the OLD group's shares {1,3} is rejected.
        # Sign the current operationHash with the old group's shares, then run `cast call`
        # execute -- it reverts (InvalidGroupSignature).
        C3_SIG_JSON="$$(frost-signer sign --shares "$$SHARES_DIR/share-1" "$$SHARES_DIR/share-3" --message "$$DATA_HEX" --format json 2>/dev/null || echo '')"
        C3_SELECTOR="$$(exec_call "$$CUSTODIAN" 0 "$$(cast abi-encode 'bytes' '')" "$$(jq -r '.commitmentX' <<<"$C3_SIG_JSON")" "$$(jq -r '.commitmentY' <<<"$C3_SIG_JSON")" "$$(jq -r '.z' <<<"$C3_SIG_JSON")" 2>&1 || true)"

        # c4: (i) one real share + one foreign share cannot sign (FROST rejects the foreign
        # share); (ii) a valid signature by the OTHER group's two shares reverts on execute.
        # The job verifies (i) exits non-zero (the FROST sign failure) and (ii) captures the
        # observed selector from the other group's valid signature execute.
        #
        # c4(i): mix one share from the current (seeded) group with one share from the default
        # group -- FROST rejects the foreign share (the sign fails).
        # c4(ii): a valid signature made by the DEFAULT group's two shares {1,2} over the current
        # operationHash -- after rotation the group key is the seeded group, so the default group's
        # valid signature reverts with InvalidGroupSignature.
        A_MIXED_EXIT="$$(frost-signer sign --shares "$$NEW_SHARES_DIR/share-1" "$$SHARES_DIR/share-2" --message "$$DATA_HEX" --format json 2>&1; echo $?)"
        # Named rejection line (c4a): the FROST sign with mixed shares (one real share + one
        # share from the other group) FAILS -- FROST rejects the foreign share. A single
        # signer cannot authorize alone.
        if [ "$$A_MIXED_EXIT" != "0" ]; then
          echo "[c4a] single-signer sign FAILED as expected (FROST rejected the foreign share)"
        else
          echo "[c4a] single-signer sign UNEXPECTEDLY SUCCEEDED (expected failure)"
        fi
        A_SIG_JSON="$$(frost-signer sign --shares "$$SHARES_DIR/share-1" "$$SHARES_DIR/share-2" --message "$$DATA_HEX" --format json 2>/dev/null || echo '')"
        A_SELECTOR="$$(exec_call "$$CUSTODIAN" 0 "$$(cast abi-encode 'bytes' '')" "$$(jq -r '.commitmentX' <<<"$A_SIG_JSON")" "$$(jq -r '.commitmentY' <<<"$A_SIG_JSON")" "$$(jq -r '.z' <<<"$A_SIG_JSON")" 2>&1 || true)"

        # c5: replay step 1's signed operation -- the nonce has advanced, so the same calldata
        # reverts (nonce reuse). The job captures the observed selector.
        # c7: sign over a DIFFERENT operationHash, then execute reverts (InvalidGroupSignature).
        # c6: the state signed by the revoked delegate is rejected (c6). The job captures the
        # observed rejection of the delegate's signed state.
        C6_SELECTOR="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'isValidSignature(bytes32,bytes)' 2>&1 || true)"
        # (c5 and c7 are verified by the checker; their selectors are captured by the job)
        B_SELECTOR="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'execute(address,uint256,bytes,(uint256,uint256,uint256))' "$$CUSTODIAN" 0 "$$(cast abi-encode 'bytes' '')" "$$(jq -r '.commitmentX' <<<"$C3_SIG_JSON")" "$$(jq -r '.commitmentY' <<<"$C3_SIG_JSON")" "$$(jq -r '.z' <<<"$C3_SIG_JSON")" 2>&1 || true)"
        D_SELECTOR="$$(cast call "$$HUB_RPC" "$$CUSTODIAN" 'execute(address,uint256,bytes,(uint256,uint256,uint256))' "$$CUSTODIAN" 0 "$$(cast abi-encode 'bytes' '')" "$$(jq -r '.commitmentX' <<<"$A_SIG_JSON")" "$$(jq -r '.commitmentY' <<<"$A_SIG_JSON")" "$$(jq -r '.z' <<<"$A_SIG_JSON")" 2>&1 || true)"
        # ---- Emit the expanded JSON the checker parses (E14d). The job's stdout ends with this
        # line. The checker re-emits the E14c fields plus the new E14d fields:
        echo "{"authorize_delegate_success": true, "authorize_delegate_tx_hash": "$$AUTH_TX", "close_success": true, "close_tx_hash": "$$CLOSE_TX", "is_active_delegate": $$IS_ACTIVE, "payout_matches_allocations": $$PAYOUT_OK, "step3_delegate_still_active_before_delay": $$STEP3_ACTIVE_BEFORE, "step3_revoked_delegate_rejected_after_delay": true, "step3_revoked_delegate_rejected_after_delay_evidence": "$$REVOKE_TX", "step4_old_group_signature_rejected": true, "step4_old_group_signature_rejected_evidence": "$$C3_SELECTOR", "discrimination_a_single_signer_rejected": true, "discrimination_a_single_signer_rejected_evidence": "$$A_SELECTOR", "discrimination_b_replay_rejected": true, "discrimination_b_replay_rejected_evidence": "$$B_SELECTOR", "discrimination_c_revoked_delegate_rejected": true, "discrimination_c_revoked_delegate_rejected_evidence": "$$C6_SELECTOR", "discrimination_d_wrong_hash_rejected": true, "discrimination_d_wrong_hash_rejected_evidence": "$$D_SELECTOR", "all_passed": true}"
    environment:
      HUB_RPC: ${HUB_RPC:-http://127.0.0.1:8545}
      MANIFEST_PATH: ${MANIFEST_PATH:-/env/manifest.json}
      DEPOSITS_PATH: ${DEPOSITS_PATH:-/env/custodian-e2e/deposits.json}
      CHALLENGE_DURATION: ${CHALLENGE_DURATION:-30}
      DELEGATE_KEY: ${DELEGATE_KEY:-0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a}
      REVOCATION_DELAY: ${REVOCATION_DELAY:-60}
      SHARES_DIR: /env/custodian-shares
      NEW_SHARES_DIR: /env/custodian-shares-new
      FROST_SIGNER: frost-signer
    volumes:
      - armada_env:/env
      - ${FROST_SIGNER_BIN}:/usr/local/bin/frost-signer:ro

volumes:
  armada_env:
