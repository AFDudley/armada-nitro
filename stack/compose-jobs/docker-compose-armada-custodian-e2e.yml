services:
  armada-custodian-e2e:
    image: cerc/armada-nitro-env:local
    # Mirrors docker-compose-armada-nitro-e2e.yml (host networking so 127.0.0.1:8545
    # resolves to geth's host-published port; $$ escapes for a literal $ in the container
    # environment). The difference: the delegate-authorization `execute` is signed with two
    # FROST shares (signers 1 and 3, the 2-of-3 threshold) instead of the single fixed group
    # scalar the nitro-e2e gate uses. Stage 2 reuses the real-proof-funded cooperative close
    # from script/FixturenetScenario.s.sol (prepare.ts stage-1 deposits.json).
    #
    # The prebuilt FROST signer binary is mounted from the repo's target/release into the
    # container at $FROST_SIGNER (a host path the checker sets via env). The job runs `keygen`
    # and `sign` with shares {1,3} to sign the `execute(authorizeDelegate)` operation.
    network_mode: host
    working_dir: /src/armada-nitro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        # Gates spend test-account USDC (shields, channel deposits); top the accounts back up to
        # the funding target first (funding.py mints only the shortfall).
        (cd /src/armada-nitro/env && python3 -m reconciler \
          --target /src/armada-nitro/env/targets/fixturenet.json --rpc http://127.0.0.1:8545 \
          --state /env --key-file /env/deployer.key --only funding)

        # Stage 1 (real-proof deposit): prepare.ts builds a Groth16-proved `depositFromNote`
        # calldata for two channels and writes it to DEPOSITS_PATH (deposits.json). The
        # cooperative close (stage 2) uses the first channel's deposit to fund it.
        mkdir -p /src/armada-poc/scripts/gates
        cp /src/armada-nitro/env/gates/nitro-e2e/prepare.ts /src/armada-poc/scripts/gates/prepare.ts
        (
          cd /src/armada-poc
          MANIFEST_PATH="$$MANIFEST_PATH" \
          DEPOSITS_OUTPUT="$$DEPOSITS_PATH" \
          CHALLENGE_DURATION="$$CHALLENGE_DURATION" \
          HUB_RPC="$$HUB_RPC" DEPLOY_ENV=local CCTP_MODE=real \
            npx hardhat run scripts/gates/prepare.ts --network hub
        )

        # ---- Stage 2: FROST delegate-authorization + cooperative close (E14c) ----
        export KEYS_DIR=/env

        run_script() {
          forge script "$$@" --rpc-url "$$HUB_RPC" --slow --broadcast
        }

        # FROST step 1 (E14c): generate the 2-of-3 group + shares {1,3}, sign the
        # `execute(authorizeDelegate)` operation with shares {1,3}, run the `execute`
        # transaction, and confirm `isActiveDelegate` flips true. The joint FROST signature
        # is what HubCustodian.execute verifies against the on-chain group key.
        #
        # keygen writes share-1, share-2, share-3 and group-pubkey.json into /env/custodian-shares.
        # The group key (X, Y) must match the on-chain HubCustodian's groupKeyX/groupKeyY.
        $${FROST_SIGNER} keygen --out /env/custodian-shares
        # Sign the `execute(authorizeDelegate)` operation with shares {1,3} (FROST rounds 1+2 +
        # aggregate). The joint signature is what HubCustodian.execute verifies against the
        # on-chain group key.
        FROST_SIG=$$($${FROST_SIGNER} sign