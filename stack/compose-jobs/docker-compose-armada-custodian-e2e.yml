services:
  armada-custodian-e2e:
    image: cerc/armada-nitro-env:${ARMADA_IMAGE_TAG}
    # Mirrors docker-compose-armada-nitro-e2e.yml: the job runs on the deployment's own
    # docker network (no host networking) and reaches geth by the compose service name
    # (armada-fixturenet-geth:8545, arn-e7a c3/c4). $$ escapes for a literal $.
    #
    # The difference (E14c): the hub custodian used here is freshly deployed under a real 2-of-3
    # FROST group (tools/frost-signer's deterministic trusted-dealer keygen), and the
    # delegate-authorization `execute` is signed with two real FROST shares (signers 1 and 3)
    # instead of the fixed single-scalar signer `armada-nitro-e2e` uses. Stage 1 reuses the
    # real-proof-funded deposit flow from env/gates/nitro-e2e/prepare.ts, bound to this fresh
    # custodian via HUB_CUSTODIAN_OVERRIDE. Stage 2 is script/CustodianFrostScenario.s.sol.
    #
    # frost-signer has no cargo/rustc in this image; the checker builds it on the host
    # (`cargo build --release --target x86_64-unknown-linux-musl`, portable across the host's
    # and this image's glibc) and this volume mounts it in at a fixed PATH location.
    working_dir: /src/armada-nitro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        # Gates spend test-account USDC (shields, channel deposits); top the accounts back up to
        # the funding target first (funding.py mints only the shortfall).
        (cd /src/armada-nitro/env && python3 -m reconciler \
          --target /src/armada-nitro/env/targets/fixturenet.json --rpc "$$HUB_RPC" \
          --state /env --key-file /env/deployer.key --only funding)

        # Circuits are baked into the image (docs/tasks/E9-operability.md); this verifies them
        # rather than downloading -- see docker-compose-armada-nitro-e2e.yml for the same step.
        (cd /src/armada-nitro/env && python3 -c "from reconciler.modules import armada; armada._ensure_circuits_fetched()")

        CHAIN_ID="$$(cast chain-id --rpc-url "$$HUB_RPC")"
        BCAST="broadcast/CustodianFrostScenario.s.sol/$$CHAIN_ID"

        run_script() {
          forge script script/CustodianFrostScenario.s.sol --sig "$$1" --rpc-url "$$HUB_RPC" --slow --ffi --broadcast
        }

        # ---- Step 1 (E14c c1, c6): deploy the custodian under a real FROST group; signers
        # {1,3} authorize the delegate through `execute` (frost-signer sign --format json via
        # forge's vm.ffi -- a real threshold signature, not a simulated one).
        mkdir -p "$$SHARES_DIR"
        frost-signer keygen --out "$$SHARES_DIR"
        run_script 'deployAndAuthorize()'
        CUSTODIAN="$$(cat deployments/custodian-e2e-custodian-address)"
        DELEGATE_ADDR="$$(cast wallet address --private-key "$$DELEGATE_KEY")"
        AUTH_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/deployAndAuthorize-latest.json")"
        IS_ACTIVE="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- Stage 1 (real-proof deposit, c3): prepare.ts builds a Groth16-proved
        # `depositFromNote` calldata bound to this custodian (HUB_CUSTODIAN_OVERRIDE) and writes
        # it to DEPOSITS_PATH.
        mkdir -p /src/armada-poc/scripts/gates
        cp /src/armada-nitro/env/gates/nitro-e2e/prepare.ts /src/armada-poc/scripts/gates/prepare.ts
        cp /src/armada-nitro/env/gates/adjudicator-abi.ts /src/armada-poc/scripts/gates/adjudicator-abi.ts
        (
          cd /src/armada-poc
          MANIFEST_PATH="$$MANIFEST_PATH" \
          DEPOSITS_OUTPUT="$$DEPOSITS_PATH" \
          CHALLENGE_DURATION="$$CHALLENGE_DURATION" \
          HUB_CUSTODIAN_OVERRIDE="$$CUSTODIAN" \
          HUB_RPC="$$HUB_RPC" DEPLOY_ENV=local CCTP_MODE=real \
            npx hardhat run scripts/gates/prepare.ts --network hub
        )

        # ---- Step 2 (E14c c2, c3): fund the channel (real-proof deposit + custodian executes,
        # each FROST-signed), then the delegate + user cooperatively close it, shielding the
        # payout (isValidSignature/EIP-1271 accepts the delegate's signature).
        run_script 'cooperativeClose()'
        CLOSE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("concludeAndTransferAllAssets(")) | .hash' "$$BCAST/cooperativeClose-latest.json")"

        # c7: the Shield log's payout note equals the closed state's allocation net of shieldFee().
        if forge script script/CustodianFrostScenario.s.sol --sig 'verify()' --rpc-url "$$HUB_RPC"; then
          PAYOUT_OK=true
        else
          PAYOUT_OK=false
        fi

        # =============================================================================
        # E14d Step 3 (revocation) + Step 4 (rotation) + Discrimination
        # =============================================================================

        # ---- Step 3 (c1, c2, c6): signers {2,3} schedule `revokeDelegate` through `execute`
        # (FROST-signed). The delegate stays active until the revocation delay elapses.
        run_script 'revoke()'
        REVOKE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/revoke-latest.json")"

        # ---- c1: before the revocation delay passes, the delegate is still active.
        STEP3_ACTIVE_BEFORE="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- c2: wait past the revocation delay; the delegate is now inactive.
        sleep $((REVOCATION_DELAY + 5))
        STEP3_ACTIVE_AFTER="$$(cast call "$$CUSTODIAN" 'isActiveDelegate(address)(bool)' "$$DELEGATE_ADDR" --rpc-url "$$HUB_RPC")"

        # ---- Step 4 (c3): signers {1,2} rotate the group key to a freshly seeded, different
        # FROST group (SHARES_DIR keeps the unchanged default seed).
        frost-signer keygen --out "$$NEW_SHARES_DIR" --seed 0x6e6974726f726170
        run_script 'rotate()'
        ROTATE_TX="$$(jq -r '.transactions[] | select((.function // "") | startswith("execute(")) | .hash' "$$BCAST/rotate-latest.json")"

        # ---- Discrimination (a)-i: a mixed-share sign (one real share from the NEW group plus
        # one share from the OLD, now-foreign group) must FAIL -- FROST rejects the foreign
        # share. Pure frost-signer CLI check, no chain interaction.
        DUMMY_MSG="0x$$(python3 -c 'print("11"*32)')"
        if frost-signer sign --shares "$$NEW_SHARES_DIR/share-1" "$$SHARES_DIR/share-2" --message "$$DUMMY_MSG" --format json >/tmp/mixed-sign.out 2>&1; then
          A_MIXED_FAILED=false
        else
          A_MIXED_FAILED=true
        fi

        # ---- Discrimination (a)-ii, (b), (c), (d) and step 4's evidence: on-chain checks run
        # by `discriminate()` as non-broadcast calls against the chain's current state -- a
        # rejection surfaces as the script's own revert data, exactly what a real `execute`
        # would do, without spending gas on a doomed transaction. Written to
        # deployments/custodian-e2e-discrimination.json.
        forge script script/CustodianFrostScenario.s.sol --sig 'discriminate()' --rpc-url "$$HUB_RPC" --ffi
        DISC_JSON="$$(cat deployments/custodian-e2e-discrimination.json)"

        # ---- Named rejection lines (the observed evidence for each discrimination check).
        echo "[step3] revoked delegate's signed state rejected: isValidSignature -> $$(echo "$$DISC_JSON" | jq -r .discrimination_c_revoked_delegate_rejected_evidence)"
        echo "[step4] old group's signature rejected: execute -> $$(echo "$$DISC_JSON" | jq -r .step4_old_group_signature_rejected_evidence)"
        echo "[discrimination-a] single-signer sign failed=$$A_MIXED_FAILED; other group's valid signature -> $$(echo "$$DISC_JSON" | jq -r .discrimination_a_single_signer_rejected_evidence)"
        echo "[discrimination-b] replay of step 1's operation -> $$(echo "$$DISC_JSON" | jq -r .discrimination_b_replay_rejected_evidence)"
        echo "[discrimination-c] revoked delegate's signed state -> $$(echo "$$DISC_JSON" | jq -r .discrimination_c_revoked_delegate_rejected_evidence)"
        echo "[discrimination-d] wrong operationHash -> $$(echo "$$DISC_JSON" | jq -r .discrimination_d_wrong_hash_rejected_evidence)"

        # ---- Emit the final JSON the checker parses (E14c fields plus E14d's). c1/c2's
        # cast-observed booleans combine with `discriminate()`'s on-chain results; the a-i CLI
        # check (mixed-share sign) combines with `discriminate()`'s a-ii on-chain result.
        FINAL_JSON="$$(jq -nc \
          --argjson disc "$$DISC_JSON" \
          --arg auth_tx "$$AUTH_TX" --arg close_tx "$$CLOSE_TX" \
          --arg is_active "$$IS_ACTIVE" --arg payout_ok "$$PAYOUT_OK" \
          --arg step3_before "$$STEP3_ACTIVE_BEFORE" --arg step3_after "$$STEP3_ACTIVE_AFTER" \
          --arg a_mixed_failed "$$A_MIXED_FAILED" \
          '{
            authorize_delegate_success: true,
            authorize_delegate_tx_hash: $$auth_tx,
            close_success: true,
            close_tx_hash: $$close_tx,
            is_active_delegate: ($$is_active == "true"),
            payout_matches_allocations: ($$payout_ok == "true"),
            step3_delegate_still_active_before_delay: ($$step3_before == "true"),
            step3_revoked_delegate_rejected_after_delay: (($$step3_after == "false") and $$disc.discrimination_c_revoked_delegate_rejected),
            step3_revoked_delegate_rejected_after_delay_evidence: $$disc.discrimination_c_revoked_delegate_rejected_evidence,
            step4_old_group_signature_rejected: $$disc.step4_old_group_signature_rejected,
            step4_old_group_signature_rejected_evidence: $$disc.step4_old_group_signature_rejected_evidence,
            discrimination_a_single_signer_rejected: (($$a_mixed_failed == "true") and $$disc.discrimination_a_single_signer_rejected),
            discrimination_a_single_signer_rejected_evidence: $$disc.discrimination_a_single_signer_rejected_evidence,
            discrimination_b_replay_rejected: $$disc.discrimination_b_replay_rejected,
            discrimination_b_replay_rejected_evidence: $$disc.discrimination_b_replay_rejected_evidence,
            discrimination_c_revoked_delegate_rejected: $$disc.discrimination_c_revoked_delegate_rejected,
            discrimination_c_revoked_delegate_rejected_evidence: $$disc.discrimination_c_revoked_delegate_rejected_evidence,
            discrimination_d_wrong_hash_rejected: $$disc.discrimination_d_wrong_hash_rejected,
            discrimination_d_wrong_hash_rejected_evidence: $$disc.discrimination_d_wrong_hash_rejected_evidence
          }')"
        echo "$$FINAL_JSON"
    environment:
      HUB_RPC: ${HUB_RPC:-http://armada-fixturenet-geth:8545}
      MANIFEST_PATH: ${MANIFEST_PATH:-/env/manifest.json}
      DEPOSITS_PATH: ${DEPOSITS_PATH:-/env/custodian-e2e/deposits.json}
      CHALLENGE_DURATION: ${CHALLENGE_DURATION:-30}
      DELEGATE_KEY: ${DELEGATE_KEY:-0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a}
      REVOCATION_DELAY: ${REVOCATION_DELAY:-60}
      SHARES_DIR: /env/custodian-shares
      NEW_SHARES_DIR: /env/custodian-shares-new
      FROST_SIGNER: frost-signer
    volumes:
      - armada_env:/env
      - ${FROST_SIGNER_BIN}:/usr/local/bin/frost-signer:ro

volumes:
  armada_env:
