# armada-r2-reclaim-conserves (docs/tasks/R2-fixturenet-defect-scenarios.md scenario (c)):
# concludes a source channel holding a guarantee allocation and its target, then calls
# `reclaim`, and reports the pool's total token balance for the reclaimed asset before and
# after the reclaim call. Runs on the real fixturenet: no testing-mode bypass of any kind.
#
# Today this is expected to report FAIL, citing departures-found.md item 2: `_settleReclaimExit`
# calls `PoolSpend.settleReclaim`, which mints `priorHeld + guaranteeAmount` for the target from
# one input of `priorHeld` -- nothing debits the source, so the pool's balance after the reclaim
# exceeds the balance before by the guarantee amount. The scenario's own acceptance is that it
# runs and reports, not that it passes today (it is not part of the commit-boundary gate).
#
# No deposit into either channel: PoolSpend.settleReclaim's own doc comment confirms a
# never-funded target channel has no prior commitment at all ("Spends the target channel's
# current commitment (if any; a never-funded target has none)"), and reclaim's own checks
# (MultiAssetHolder._apply_reclaim_checks) never read holdings/heldValue for either channel --
# only that both are finalized (ForceMove) and the source's outcome carries a guarantee
# allocation to the target. So this scenario needs no pool proof of any kind, real or
# bypassed: script/R2ReclaimScenario.s.sol finalizes both channels with a force-move
# `challenge` signed directly by the two test-account participants, then calls `reclaim`.
#
# No host networking: HUB_RPC resolves to the compose service name (arn-e7a c3/c4); the job
# runs on the deployment's own docker network ($$ escapes a literal $ from the orchestrator's
# own template interpolation).
services:
  R2-reclaim-conserves:
    image: cerc/armada-nitro-env:${ARMADA_IMAGE_TAG}
    working_dir: /src/armada-nitro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        export KEYS_DIR=/env

        run_script() {
          forge script script/R2ReclaimScenario.s.sol --sig "$$1" --rpc-url "$$HUB_RPC" --slow --broadcast
        }

        run_script 'finalizeTarget()'
        echo "waiting out the $${CHALLENGE_DURATION}s challenge window (target)"
        sleep $$((CHALLENGE_DURATION + 3))

        run_script 'finalizeSource()'
        echo "waiting out the $${CHALLENGE_DURATION}s challenge window (source)"
        sleep $$((CHALLENGE_DURATION + 3))

        forge script script/R2ReclaimScenario.s.sol --sig 'reclaimReport()' --rpc-url "$$HUB_RPC" --slow --broadcast
    environment:
      HUB_RPC: ${HUB_RPC:-http://armada-fixturenet-geth:8545}
      MANIFEST_PATH: ${MANIFEST_PATH:-/env/manifest.json}
      CHALLENGE_DURATION: ${CHALLENGE_DURATION:-15}
    volumes:
      - armada_env:/env

volumes:
  armada_env:
