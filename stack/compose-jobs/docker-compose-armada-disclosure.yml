# The selective-disclosure acceptance job (arn-c53/arn-252), invoked by stack/scripts/
# armada-disclosure-acceptance.py via `run-job armada-disclosure` (never a direct host read
# of the deployment's own data directory -- gates and runners reach the fixturenet only via
# run-job and RPC).
#
# Two parts, both run inside the deployment's own docker network (no host networking --
# HUB_RPC is a compose service name):
#   1. Up-check: the pool, the HubCustodian and the adjudicator respond on the fixturenet RPC.
#   2. Hop runner: the selective-disclosure hops H1-H7 are executed as real transactions, the
#      disclosure package is written, and one JSON line is printed to stdout.
#
# The job prints the up-check JSON line, then the hop runner's JSON line (the last JSON
# parseable line, which the acceptance script reads back).
services:
  armada-disclosure:
    image: cerc/armada-nitro-env:${ARMADA_IMAGE_TAG}
    working_dir: /src/armada-nitro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        # ---- part 1: up-check (pool, HubCustodian, adjudicator respond on the fixturenet RPC) ----
        python3 - <<'PY'
        import json
        import os
        import subprocess

        manifest = json.load(open("/env/manifest.json"))
        pool = manifest["armada"]["pool"]
        usdc = manifest["armada"]["usdc"]
        adjudicator = manifest["armadaNitro"]["adjudicator"]
        custodian = manifest["armadaNitro"]["hubCustodian"]
        rpc = os.environ["HUB_RPC"]

        def cast_ok(addr, sig, *args):
            p = subprocess.run(
                ["cast", "call", addr, sig, *args, "--rpc-url", rpc],
                capture_output=True,
                text=True,
            )
            if p.returncode != 0:
                print(f"cast call {addr} {sig} failed: {p.stderr}")
            return p.returncode == 0 and bool(p.stdout.strip())

        pool_ok = cast_ok(pool, "usdc()(address)")
        adjudicator_ok = cast_ok(adjudicator, "isAsset(address)", usdc)
        custodian_ok = cast_ok(
            custodian,
            "isActiveDelegate(address)",
            "0x0000000000000000000000000000000000000000",
        )
        print(f"pool responds: {pool_ok}; adjudicator responds: {adjudicator_ok}; custodian responds: {custodian_ok}")
        print(json.dumps({"fixturenet_up": pool_ok and adjudicator_ok and custodian_ok}))
        PY

        # ---- part 2: run the selective-disclosure hop runner (H1-H7 as real transactions) ----
        mkdir -p /src/armada-poc/scripts/gates
        cp /src/armada-nitro/env/gates/nitro-disclosure/disclosure.ts /src/armada-poc/scripts/gates/disclosure.ts
        (
          cd /src/armada-poc
          MANIFEST_PATH=/env/manifest.json \
          PACKAGE_PATH=/env/nitro-disclosure/disclosure-package.json \
          FROST_SHARES_DIR=/env \
          FROST_SIGNER=frost-signer \
          HUB_RPC="$$HUB_RPC" DEPLOY_ENV=local CCTP_MODE=real \
          npx hardhat run scripts/gates/disclosure.ts
        )
    environment:
      HUB_RPC: ${HUB_RPC:-http://armada-fixturenet-geth:8545}
      FROST_SHARES_DIR: ${FROST_SHARES_DIR:-/env}
      FROST_SIGNER: ${FROST_SIGNER:-frost-signer}
    volumes:
      - armada_env:/env

volumes:
  armada_env:
