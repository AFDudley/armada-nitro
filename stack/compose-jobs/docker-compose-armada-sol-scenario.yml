services:
  armada-sol-scenario:
    image: cerc/armada-nitro-env:${ARMADA_IMAGE_TAG}
    # One scenario per external function of PoolSol (env/gates/armada-sol/scenarios.ts), against
    # the pool that the armada_sol reconciler module deployed. Like armada-env-verify, the job runs
    # on the deployment's own docker network and reaches geth by its compose service name.
    working_dir: /src/armada-nitro/env
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        # The scenarios spend test-account USDC; top the accounts up to the funding target first.
        python3 -m reconciler \
          --target /src/armada-nitro/env/targets/fixturenet.json --rpc "$${HUB_RPC}" \
          --state /env --key-file /env/deployer.key --only funding
        python3 -m reconciler \
          --target /src/armada-nitro/env/targets/fixturenet.json --rpc "$${HUB_RPC}" \
          --state /env --key-file /env/deployer.key --only armada_sol --verify-only

        mkdir -p /src/armada-poc/scripts/gates
        cp /src/armada-nitro/env/gates/armada-sol/scenarios.ts /src/armada-poc/scripts/gates/armada-sol-scenarios.ts
        cd /src/armada-poc
        DEPLOY_ENV=local CCTP_MODE=real npx hardhat run scripts/gates/armada-sol-scenarios.ts --network hub
    environment:
      MANIFEST_PATH: ${MANIFEST_PATH:-/env/manifest.json}
      HUB_RPC: ${HUB_RPC:-http://armada-fixturenet-geth:8545}
    volumes:
      - armada_env:/env

volumes:
  armada_env:

# The project network's options, as stack/compose/docker-compose-armada-fixturenet.yml sets them.
networks:
  default:
    enable_ipv6: true
