# /etc/gai.conf of the env image: getaddrinfo puts a public IPv6 address before an IPv4 one.
#
# On the fixturenet network a container has an IPv4 address and a unique-local IPv6 address
# (fc00::/7, NATed by the host). glibc's default label table gives fc00::/7 its own label, so
# RFC 6724 rule 5 (matching labels) ranks every public IPv6 destination below IPv4. The table
# below is glibc's default with fc00::/7 in the label of ::/0. Some RPC vendors reset IPv4
# connections from the fixturenet host and accept IPv6 (env/oracle-rpcs.json).
label ::1/128       0
label ::/0          1
label fc00::/7      1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label 2001:0::/32   7
