services:
  armada-fixturenet-genesis:
    image: ethpandaops/ethereum-genesis-generator:6.2.1
    entrypoint:
      - sh
      - -c
    command:
      - |
        set -e
        export GENESIS_TIMESTAMP=$(date +%s)
        # Warm restore (fixturenet-new EL-only snapshot): a recorded execution
        # head block is dropped in this volume as shadow-fork-block.json. Point the
        # generator's shadow-fork support at it so the regenerated consensus genesis
        # anchors slot 0 on geth's existing head (its latest_execution_payload_header
        # becomes that block) with GENESIS_TIMESTAMP=now -- no slot gap however old
        # the snapshot is. Absent on a cold/fresh start, so el+cl genesis is
        # generated normally from block 0. genesis.json (EL) and jwtsecret already
        # present from the snapshot are kept; only the consensus genesis is (re)built.
        if [ -f /data/shadow-fork-block.json ]; then
          export SHADOW_FORK_FILE=/data/shadow-fork-block.json
          echo "genesis: shadow-fork restore onto EL head number=$(jq -r .number /data/shadow-fork-block.json) hash=$(jq -r .hash /data/shadow-fork-block.json)"
        fi
        /work/entrypoint.sh all
        # The nimbus-eth1/nimbus-eth2 pair (below) uses its own engine-API JWT,
        # separate from geth+lighthouse's /data/jwt/jwtsecret, so the two engine
        # API channels stay independent. Generated once per deployment; devnet-only
        # material, no different in sensitivity from the test mnemonic above.
        if [ ! -f /data/jwt/nimbus-jwtsecret ]; then
          openssl rand -hex 32 > /data/jwt/nimbus-jwtsecret
        fi
    environment:
      CHAIN_ID: "31337"
      EL_AND_CL_MNEMONIC: "test test test test test test test test test test test junk"
      NUMBER_OF_VALIDATORS: "4"
      SLOT_DURATION_MS: "2000"
      ALTAIR_FORK_EPOCH: "0"
      BELLATRIX_FORK_EPOCH: "0"
      CAPELLA_FORK_EPOCH: "0"
      DENEB_FORK_EPOCH: "0"
      ELECTRA_FORK_EPOCH: "0"
      FULU_FORK_EPOCH: "0"
      GLOAS_FORK_EPOCH: "18446744073709551615"
      HEZE_FORK_EPOCH: "18446744073709551615"
      EIP7441_FORK_EPOCH: "18446744073709551615"
      EIP7928_FORK_EPOCH: "18446744073709551615"
      EIP8321_FORK_EPOCH: "18446744073709551615"
      EL_PREMINE_COUNT: "10"
      EL_PREMINE_BALANCE: "10000ETH"
    volumes:
      - armada_fixturenet_genesis:/data
      - armada_env:/env

  armada-fixturenet-geth:
    image: ethereum/client-go:v1.17.6
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
    # restart "no" on every chain service: the chain lives only in its RAM-backed
    # data/ (stack/README.md). After a host reboot no container may start against the
    # bare on-disk mountpoint; stack/scripts/fixturenet-recover brings the chain back.
    # A geth that fills its capped RAM disk dies and stays down.
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${GETH_CPUSET:-10,26}"
    volumes:
      - armada_fixturenet_genesis:/data
      - geth_data:/root/ethdata
    entrypoint:
      - sh
      - -c
    command:
      - |
        set -e
        # init subcommand (separate command, never takes the node flags)
        if [ ! -d /root/ethdata/geth/chaindata ] && [ ! -d /root/ethdata/geth/ ] 2>/dev/null; then
          geth init --datadir /root/ethdata /data/metadata/genesis.json
        fi
        # geth's default HTTP IdleTimeout (120s) closes a keep-alive connection that sits idle
        # while a `forge script --broadcast --slow` external deploy runs for several minutes on a
        # separate connection (armada-nitro's Lido 0135 step); the next write on the stale, closed
        # socket then fails (EPIPE). Override only IdleTimeout via --config, leaving every other
        # timeout/flag at its default.
        cat > /tmp/geth-http-timeouts.toml <<'EOF'
        [Node.HTTPTimeouts]
        IdleTimeout = 3600000000000
        EOF
        exec geth           --config /tmp/geth-http-timeouts.toml           --datadir /root/ethdata           --datadir.minfreedisk=64           --networkid=31337           --http           --http.addr=0.0.0.0           --http.port=8545           --http.api=eth,net,web3,debug,txpool           --http.corsdomain="*"           --http.vhosts=*           --ws           --ws.addr=0.0.0.0           --ws.port=8546           --ws.api=eth,net,web3,debug,txpool           --authrpc.addr=0.0.0.0           --authrpc.port=8551           --authrpc.vhosts=*           --authrpc.jwtsecret=/data/jwt/jwtsecret           --miner.gasprice=1           --syncmode=full
    ports:
      - "8545"
      - "8546"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          wget -q -O - --header 'Content-Type: application/json' --post-data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' http://localhost:8545
      interval: 5s
      timeout: 5s
      retries: 30

  armada-fixturenet-beacon:
    image: sigp/lighthouse:v8.2.2
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-geth:
        condition: service_healthy
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${BEACON_CPUSET:-11,27}"
    volumes:
      - armada_fixturenet_genesis:/data
      - beacon_data:/root/beacon
    ports:
      - "5052"
    command:
      - sh
      - -c
      - |
        set -e
        # Fixed libp2p identity so nimbus-eth2 (armada-fixturenet-nimbus-cl,
        # below) can dial a known peer id with no discovery step -- this
        # devnet has no bootnodes and no DHT. Devnet-only key, no different
        # in sensitivity from the test mnemonic above.
        mkdir -p /root/beacon/beacon/network
        if [ ! -f /root/beacon/beacon/network/key ]; then
          echo "2e480c39261e2e00ac89626cf18a67216922815d80277d1170551d6b13ef5197" > /root/beacon/beacon/network/key
        fi
        # target-peers raised from 0 (its value before nimbus-eth2 joined this
        # fixturenet) to 1, so lighthouse accepts that one direct peer; it still
        # runs no discovery (no bootnodes configured).
        exec lighthouse bn           --datadir /root/beacon           --testnet-dir /data/metadata           --execution-endpoint http://armada-fixturenet-geth:8551           --execution-jwt /data/jwt/jwtsecret           --http           --http-address 0.0.0.0           --http-port 5052           --port 4000           --target-peers 1           --allow-insecure-genesis-sync           --ignore-ws-check
    healthcheck:
      # lighthouse's image ships no wget/curl; a bare TCP connect is the
      # only check available without adding a package.
      test:
        - CMD-SHELL
        - bash -c '>/dev/tcp/127.0.0.1/5052' 2>/dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  armada-fixturenet-validator-0:
    image: sigp/lighthouse:v8.2.2
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-geth:
        condition: service_healthy
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${VALIDATOR_0_CPUSET:-12}"
    volumes:
      - armada_fixturenet_genesis:/data
      - validator_0_data:/root
    command:
      - sh
      - -c
      - |
        # validator 0 of 4: one key (mnemonic index 0), one process, one core
        if [ ! -d /root/validators ] 2>/dev/null; then
          printf '%s' "test test test test test test test test test test test junk" > /tmp/mnemonic.txt
          lighthouse account_manager validator recover             --datadir /root             --count 1             --first-index 0             --testnet-dir /data/metadata             --mnemonic-path /tmp/mnemonic.txt             --stdin-inputs
        fi
        exec lighthouse vc           --datadir /root           --testnet-dir /data/metadata           --beacon-nodes http://armada-fixturenet-beacon:5052           --init-slashing-protection           --suggested-fee-recipient 0x000000000000000000000000000000000000fEE5

  armada-fixturenet-validator-1:
    image: sigp/lighthouse:v8.2.2
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-geth:
        condition: service_healthy
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${VALIDATOR_1_CPUSET:-13}"
    volumes:
      - armada_fixturenet_genesis:/data
      - validator_1_data:/root
    command:
      - sh
      - -c
      - |
        # validator 1 of 4: one key (mnemonic index 1), one process, one core
        if [ ! -d /root/validators ] 2>/dev/null; then
          printf '%s' "test test test test test test test test test test test junk" > /tmp/mnemonic.txt
          lighthouse account_manager validator recover             --datadir /root             --count 1             --first-index 1             --testnet-dir /data/metadata             --mnemonic-path /tmp/mnemonic.txt             --stdin-inputs
        fi
        exec lighthouse vc           --datadir /root           --testnet-dir /data/metadata           --beacon-nodes http://armada-fixturenet-beacon:5052           --init-slashing-protection           --suggested-fee-recipient 0x000000000000000000000000000000000000fEE5

  armada-fixturenet-validator-2:
    image: sigp/lighthouse:v8.2.2
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-geth:
        condition: service_healthy
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${VALIDATOR_2_CPUSET:-14}"
    volumes:
      - armada_fixturenet_genesis:/data
      - validator_2_data:/root
    command:
      - sh
      - -c
      - |
        # validator 2 of 4: one key (mnemonic index 2), one process, one core
        if [ ! -d /root/validators ] 2>/dev/null; then
          printf '%s' "test test test test test test test test test test test junk" > /tmp/mnemonic.txt
          lighthouse account_manager validator recover             --datadir /root             --count 1             --first-index 2             --testnet-dir /data/metadata             --mnemonic-path /tmp/mnemonic.txt             --stdin-inputs
        fi
        exec lighthouse vc           --datadir /root           --testnet-dir /data/metadata           --beacon-nodes http://armada-fixturenet-beacon:5052           --init-slashing-protection           --suggested-fee-recipient 0x000000000000000000000000000000000000fEE5

  armada-fixturenet-validator-3:
    image: sigp/lighthouse:v8.2.2
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-geth:
        condition: service_healthy
    restart: "no"
    cgroup_parent: ${FIXTURENET_SLICE:-fixturenet.slice}
    cpuset: "${VALIDATOR_3_CPUSET:-15}"
    volumes:
      - armada_fixturenet_genesis:/data
      - validator_3_data:/root
    command:
      - sh
      - -c
      - |
        # validator 3 of 4: one key (mnemonic index 3), one process, one core
        if [ ! -d /root/validators ] 2>/dev/null; then
          printf '%s' "test test test test test test test test test test test junk" > /tmp/mnemonic.txt
          lighthouse account_manager validator recover             --datadir /root             --count 1             --first-index 3             --testnet-dir /data/metadata             --mnemonic-path /tmp/mnemonic.txt             --stdin-inputs
        fi
        exec lighthouse vc           --datadir /root           --testnet-dir /data/metadata           --beacon-nodes http://armada-fixturenet-beacon:5052           --init-slashing-protection           --suggested-fee-recipient 0x000000000000000000000000000000000000fEE5

  armada-fixturenet-nimbus-el:
    # nimbus-eth1 v0.4.3: non-validating execution client, paired below with
    # nimbus-eth2 over its own engine API + JWT (nimbus-jwtsecret, generated by
    # armada-fixturenet-genesis above). Reads the same EL genesis geth uses
    # (/data/metadata/genesis.json). No devp2p peering with geth: its execution
    # payloads arrive solely via engine_newPayload/forkchoiceUpdated from
    # nimbus-eth2, the same way geth's arrive solely from lighthouse. No
    # cgroup_parent/cpuset: unlike geth/lighthouse/validators, this is a
    # non-validating follower, not on the fixturenet's latency-sensitive
    # block-production path, so it runs in the host's shared CPU pool
    # (laconic-tech-ops infra/kelce host_cpu_policy), not the reserved slice.
    image: statusim/nimbus-eth1:linux-amd64-v0.4.3@sha256:2689fe3746e19b017b5402ed590c17a4a857a456f4a2c2e5f51ae013a32dd19d
    # The image's default user (uid 1000, "user") cannot write the RAM-tmpfs
    # volume dir below: stack/scripts/fixturenet-new creates every volume dir
    # with `sudo mkdir -p`, so it is root-owned, like every other service's
    # volume in this file. Run as root, matching geth/lighthouse/genesis.
    user: "0:0"
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - armada_fixturenet_genesis:/data:ro
      - nimbus_el_data:/root/nimbus-el
    entrypoint:
      - /home/user/nimbus-eth1/build/nimbus
    command:
      - executionClient
      - --data-dir=/root/nimbus-el
      - --network=/data/metadata
      - --http-address=0.0.0.0
      - --http-port=8545
      - --rpc
      - --engine-api
      - --engine-api-address=0.0.0.0
      - --engine-api-port=8551
      - --jwt-secret=/data/jwt/nimbus-jwtsecret
    ports:
      - "8545"
    healthcheck:
      # Neither nimbus image ships wget/curl (unlike geth's); a bare TCP
      # connect is the only check available without adding a package.
      test:
        - CMD-SHELL
        - bash -c '>/dev/tcp/127.0.0.1/8545' 2>/dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  armada-fixturenet-nimbus-cl:
    # nimbus-eth2 v26.10.1: non-validating full beacon node, following
    # lighthouse's chain and serving the light-client REST API the nimbus
    # verified proxy consumes (docs/ENVIRONMENT.md "Fixed choices").
    image: statusim/nimbus-eth2:amd64-v26.10.1@sha256:c052f011b8f005c18826046e8f3413482284ebd4bf9568b61d4dc548a6141442
    # Same root-owned RAM-tmpfs volume issue as armada-fixturenet-nimbus-el
    # above; run as root for the same reason.
    user: "0:0"
    depends_on:
      armada-fixturenet-genesis:
        condition: service_completed_successfully
      armada-fixturenet-nimbus-el:
        condition: service_healthy
      armada-fixturenet-beacon:
        condition: service_healthy
    restart: "no"
    volumes:
      - armada_fixturenet_genesis:/data:ro
      - nimbus_cl_data:/root/beacon-nimbus
    ports:
      - "5052"
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -e
        # Known peer id of armada-fixturenet-beacon (lighthouse), computed
        # offline from the fixed network key that service's command seeds into
        # its data dir. Dialled directly: this devnet has no discovery
        # bootnodes, so without a known peer id neither side finds the other.
        # nim-libp2p's dialer refuses a /dns4/... direct-peer multiaddr
        # ("Can't resolve DNSADDR without NameResolver"); resolve the ip
        # ourselves and dial an /ip4/... multiaddr instead.
        BEACON_IP=$(getent hosts armada-fixturenet-beacon | awk '{print $1}')
        # nimbus-eth2's own light-client-accelerated sync (--sync-light-client,
        # default true) fails `process_light_client_update` ("error=Invalid")
        # on this fixturenet; disabling it only turns off nimbus's own
        # consumption of light-client data to accelerate its sync. It still
        # serves light-client data to others via --light-client-data-serve
        # below, and still gets a normal, unaccelerated block-by-block p2p
        # sync from its peer.
        #
        # A freshly-started nimbus-eth2 reports an incorrect Status message
        # (finalized_epoch=1, finalized_root=genesis block root) in place of
        # the spec value (finalized_epoch=0) for a node with no finality yet.
        # Lighthouse's handshake rejects this as "Different finalized chain"
        # (sigp/lighthouse v8.2.2,
        # beacon_node/network/src/network_beacon_processor/rpc_methods.rs:120)
        # once lighthouse's own finalized epoch passes 1, then permanently
        # bans nimbus-eth2's fixed peer id. Root-caused against this
        # fixturenet with --log-level="DEBUG; TRACE:libp2p,gossipsub" on this
        # service and lighthouse's matching "Handshake Failure ... Different
        # finalized chain" log line (armada-laconic
        # .scratch/NimbusPair2/REPORT.md). Fix: bootstrap nimbus-eth2's
        # database from lighthouse's REST API with `trustedNodeSync` before
        # the normal p2p-following beacon node starts, so nimbus-eth2's own
        # finalized checkpoint is real and matches lighthouse's from the
        # first connection. This downloads a state and a block over REST; it
        # does not use the light client sync protocol (that is the separate
        # `--trusted-block-root` flag, not used here), so it does not hit the
        # process_light_client_update defect above. The loop waits for
        # lighthouse's first post-genesis finalized checkpoint, since a
        # checkpoint still at genesis (slot 0) would carry the same defect.
        if [ ! -d /root/beacon-nimbus/db ]; then
          while :; do
            rm -rf /root/beacon-nimbus/db
            set +e
            TNS_LOG=$(/home/user/nimbus_beacon_node trustedNodeSync \
              --network=/data/metadata \
              --data-dir=/root/beacon-nimbus \
              --trusted-node-url=http://armada-fixturenet-beacon:5052 \
              --non-interactive 2>&1)
            set -e
            echo "$$TNS_LOG"
            CKPT_SLOT=$(printf '%s\n' "$$TNS_LOG" | grep 'Checkpoint written to database' | grep -o 'stateSlot=[0-9]*' | cut -d= -f2)
            if [ -n "$$CKPT_SLOT" ] && [ "$$CKPT_SLOT" -gt 0 ]; then
              break
            fi
            echo "trustedNodeSync: no post-genesis finalized checkpoint on lighthouse yet, retrying in 5s"
            sleep 5
          done
        fi
        exec /home/user/nimbus_beacon_node \
          --data-dir=/root/beacon-nimbus \
          --network=/data/metadata \
          --el=http://armada-fixturenet-nimbus-el:8551 \
          --jwt-secret=/data/jwt/nimbus-jwtsecret \
          --rest \
          --rest-address=0.0.0.0 \
          --rest-port=5052 \
          --rest-allow-origin=* \
          --light-client-data-serve=true \
          --light-client-data-import-mode=full \
          --sync-light-client=false \
          --direct-peer=/ip4/$${BEACON_IP}/tcp/4000/p2p/16Uiu2HAkverB2JS5mTTPVAhG7RRz23ri1HiSmrNCWLzEcSa2ETri \
          --non-interactive
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '>/dev/tcp/127.0.0.1/5052' 2>/dev/null
      interval: 5s
      timeout: 5s
      # The trustedNodeSync bootstrap above (comment, further up) waits for
      # lighthouse's first post-genesis finalized checkpoint before this
      # service's REST port opens. start_period excludes that wait from the
      # retry count, so a slow first finalization does not mark the
      # container unhealthy before it has had a chance to start the REST
      # server.
      start_period: 6m
      retries: 12

volumes:
  armada_fixturenet_genesis:
  geth_data:
  beacon_data:
  validator_0_data:
  validator_1_data:
  validator_2_data:
  validator_3_data:
  armada_env:
  nimbus_el_data:
  nimbus_cl_data:
