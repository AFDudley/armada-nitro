services:
  nitro-railgun-anvil:
    image: cerc/nitro-railgun-foundry:local
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--hardfork"
      - "osaka"
      - "--block-time"
      - "1"
    ports:
      - "8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 30
