---
# Mount a capped tmpfs over each listed deployment data directory. A forgotten
# fixturenet fills its RAM disk and dies instead of growing on a shared disk, and
# the chain's fsyncs never wait behind other writers. Run this AFTER
# `laconic-so deploy create` (which creates the data dir and the empty per-volume
# subdirectories docker bind-mounts into) and BEFORE `... start`.
#
# `deploy create` makes the per-volume subdirectories on the underlying disk;
# once a tmpfs is mounted over data/ they are hidden and empty, and docker's bind
# volumes refuse to start if their target subdirectory is missing. So we snapshot
# that (empty) subdirectory skeleton before mounting and recreate it inside the
# fresh tmpfs -- reproducing exactly what a from-scratch chain needs, in RAM.

- name: Compute systemd unit names for the tmpfs mounts
  ansible.builtin.command: "systemd-escape -p --suffix=mount {{ item.path }}"
  changed_when: false
  check_mode: false
  loop: "{{ fixturenet_tmpfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: _fixturenet_mount_names

- name: Ensure the tmpfs mountpoints exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default(fixturenet_tmpfs_default_mode) }}"
  loop: "{{ fixturenet_tmpfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Detect which targets are already mounted
  ansible.builtin.command: "findmnt --mountpoint {{ item.path }}"
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ fixturenet_tmpfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: _fixturenet_mounted

- name: Snapshot the volume subdirectory skeleton of not-yet-mounted targets
  ansible.builtin.find:
    paths: "{{ item.item.path }}"
    file_type: directory
    recurse: false
  when: item.rc != 0
  loop: "{{ _fixturenet_mounted.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: _fixturenet_skeleton

- name: Install the tmpfs mount units
  ansible.builtin.template:
    src: tmpfs.mount.j2
    dest: "/etc/systemd/system/{{ item.stdout }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _fixturenet_mount_names.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: _fixturenet_mount_units

- name: Reload systemd after mount-unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _fixturenet_mount_units is changed

- name: Enable and start the tmpfs mounts
  ansible.builtin.systemd_service:
    name: "{{ item.stdout }}"
    enabled: true
    state: started
  loop: "{{ _fixturenet_mount_names.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Recreate the volume subdirectory skeleton inside freshly mounted tmpfs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop: >-
    {{ _fixturenet_skeleton.results
       | selectattr('files', 'defined')
       | map(attribute='files') | flatten }}
  loop_control:
    label: "{{ item.path }}"
