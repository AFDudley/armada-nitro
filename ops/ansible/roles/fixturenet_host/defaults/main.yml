---
# fixturenet_host role defaults.
#
# The role has two independent, boring pieces plus an opt-in third:
#   1. a persistent systemd slice that owns the fixturenet's containers, pinned
#      to a reserved set of CPUs (the core of the setup);
#   2. capped tmpfs mounts over the deployment data directories, so the chain's
#      fsyncs never wait behind other writers on a shared disk;
#   3. (opt-in) host-wide isolation: confine everything *else* on the host to
#      the complementary CPUs and narrow the kernel workqueue mask, so no other
#      workload can bleed onto the fixturenet's reserved cores.
#
# See ops/ansible/README.md and docs/tasks/E12-lido-full-scratch.md for why each
# setting exists.

# --- 1. The slice -----------------------------------------------------------

# Name of the systemd slice the fixturenet's containers run under. Must end in
# ".slice" and match the compose FIXTURENET_SLICE / cgroup_parent value.
fixturenet_slice_name: "fixturenet.slice"

# CPUs the slice is allowed to run on, as a systemd AllowedCPUs list
# (e.g. "10-15,26-31"). REQUIRED -- there is no safe default, since the right
# cores are host-specific.
#
# How to pick: choose a contiguous block of physical cores that no other
# workload needs. On an SMT/hyperthreaded host include each core's sibling
# thread too (on this repo's reference host, kelce, thread siblings are CPU n
# and n+16, so cores 10-15 pair with 26-31 -> "10-15,26-31"). The compose file
# then pins geth and the beacon to 2 cores each and one validator per remaining
# core; with six services that means at least six cores in the list.
fixturenet_slice_allowed_cpus: ""

# Description written into the slice unit.
fixturenet_slice_description: "Fixturenet chain processes (reserved cores)"

# --- 2. tmpfs data mounts ---------------------------------------------------

# tmpfs mounts to place over deployment data directories. Each item:
#   path: absolute path to the deployment's data/ directory
#         (e.g. /home/you/deployments/armada-fixturenet/data)
#   size: tmpfs size (default fixturenet_tmpfs_default_size)
#   mode: mount mode  (default fixturenet_tmpfs_default_mode)
# Empty by default; set it per deployment. See the README for ordering
# (mount goes on *after* `laconic-so deploy create`, *before* `... start`).
fixturenet_tmpfs_mounts: []

fixturenet_tmpfs_default_size: "3G"
fixturenet_tmpfs_default_mode: "0755"

# --- 3. Opt-in host-wide isolation ------------------------------------------

# Confine system.slice, user.slice and init.scope to the complementary CPUs and
# narrow the kernel workqueue mask. OFF by default: it touches every other
# workload on the host, so it must be an explicit choice on a shared machine.
fixturenet_host_isolation: false

# CPUs everything *other* than the fixturenet may use -- the complement of
# fixturenet_slice_allowed_cpus over the host's CPU set, as an AllowedCPUs list
# (e.g. "0-9,16-25"). REQUIRED when fixturenet_host_isolation is true.
fixturenet_host_other_cpus: ""

# Hex CPU mask written to /sys/devices/virtual/workqueue/cpumask, matching
# fixturenet_host_other_cpus (unbound kernel workqueues then avoid the reserved
# cores). Little-endian 32-bit words, high word first, no "0x"
# (e.g. cores 0-9,16-25 -> "03ff03ff"). REQUIRED when isolation is true.
fixturenet_workqueue_cpumask: ""
