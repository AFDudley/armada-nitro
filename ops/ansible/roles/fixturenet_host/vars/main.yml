---
# Units confined to the complementary CPUs when host isolation is enabled:
# everything on the host that is not the fixturenet slice.
_fixturenet_isolation_units:
  - system.slice
  - user.slice
  - init.scope

# Filename used for the per-unit AllowedCPUs drop-in this role installs.
_fixturenet_isolation_dropin: "10-fixturenet-isolation.conf"

# Where "systemctl set-property --runtime" parks its drop-ins; the role removes
# any it finds so the persistent /etc drop-ins are the only source.
_fixturenet_runtime_dropin: "50-AllowedCPUs.conf"

_fixturenet_workqueue_path: "/sys/devices/virtual/workqueue/cpumask"
_fixturenet_workqueue_tmpfiles: "/etc/tmpfiles.d/fixturenet-workqueue.conf"
