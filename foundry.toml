[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Sepolia and the local anvil both run the latest fork. Solc 0.8.17 (go-nitro, Armada) is clamped
# to the newest EVM version it supports; the FROST verifier (solc ^0.8.37) targets this one.
evm_version = "osaka"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@statechannels/exit-format/=lib/exit-format/",
    "frost-secp256k1-evm/=lib/frost-secp256k1-evm/src/",
    "armada/=lib/armada-poc/contracts/",
]
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
    { access = "read", path = "./lib/armada-poc/lib/poseidon_bytecode.json" },
    { access = "read", path = "/env" },
]
# Armada's Poseidon libraries are circomlib-generated bytecode; PoseidonLibs.sol is only an ABI stub.
# Tests etch the real bytecode (lib/armada-poc/lib/poseidon_bytecode.json) at these addresses.
# M8 moved the Poseidon stubs from railgun/logic/Poseidon.sol to privacy-pool/types/PoseidonLibs.sol.
libraries = [
    "lib/armada-poc/contracts/privacy-pool/types/PoseidonLibs.sol:PoseidonT3:0x00000000000000000000000000000000000e0503",
    "lib/armada-poc/contracts/privacy-pool/types/PoseidonLibs.sol:PoseidonT4:0x00000000000000000000000000000000000E0504",
]

# arn-831: the production fixturenet deploy (env/reconciler/modules/armada_nitro.py,
# FOUNDRY_PROFILE=production) compiles under this profile instead. Leaving `libraries` empty
# here means PoseidonT3/PoseidonT4 compile unlinked; armada_nitro.py's own forge invocation
# then supplies the real link target on the command line (`--libraries ...:PoseidonT3:<addr>`,
# `...:PoseidonT4:<addr>`), reading the address from the SAME real, functional Poseidon
# deployment armada.py's own privacy-pool deploy already made for the pool
# (lib/poseidon_bytecode.json's bytecode, sent as a plain CREATE). Without that explicit
# --libraries flag, `forge script --broadcast` would instead auto-deploy PoseidonT3/PoseidonT4
# from THIS file's own source -- a compile-time revert stub, never a working Poseidon
# implementation -- and link PoolSpend.sol to that; armada_nitro.py's own post-broadcast check
# fails the reconcile if that ever happens. The fixed addresses above stay for `forge test` and
# the local-anvil scripts (LocalArmada.s.sol and friends), which etch bytecode there for speed.
[profile.production]
libraries = []

[fmt]
line_length = 100
